server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long cache for hashed assets (rsbuild emits content-hashed filenames)
    location /static/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — react-router handles client-side routing.
    # no-cache on every response from this block so that after a new deploy
    # browsers always re-fetch index.html and get the current asset hashes.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Direct access to /index.html — same no-cache policy
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
