const ReviewerAiAssist = ({ onComplete, onCancel }) => {
  const { useEffect: useEffAI } = React;
  const [step,  setStep]  = useState('intro');
  const [phase, setPhase] = useState(0);
  const [rows,  setRows]  = useState([]);

  const GEN_PHASES = [
    'Reviewing available deal materials…',
    'Analyzing financial and legal disclosures…',
    'Identifying information gaps and risk areas…',
    'Cross-referencing typical buyer checklists…',
    'Drafting targeted questions…',
    'Prioritizing by deal significance…',
  ];

  useEffAI(()=>{
    if(step !== 'generating') return;
    if(phase < GEN_PHASES.length - 1){
      const t = setTimeout(()=>setPhase(p=>p+1), 680);
      return ()=>clearTimeout(t);
    } else {
      const t = setTimeout(()=>{
        setRows(SAMPLE_AI_QUESTIONS.map((q,i)=>({...q, _idx:i, selected:true})));
        setStep('preview');
      }, 750);
      return ()=>clearTimeout(t);
    }
  }, [step, phase]);

  const [editingIdx, setEditingIdx] = useState(null);

  const toggle    = i   => setRows(r=>r.map(row=>row._idx===i?{...row,selected:!row.selected}:row));
  const toggleAll = chk => setRows(r=>r.map(row=>({...row,selected:chk})));
  const setRowCat = (i,cat) => setRows(r=>r.map(row=>row._idx===i?{...row,category:cat}:row));
  const setRowPri = (i,pri) => setRows(r=>r.map(row=>row._idx===i?{...row,priority:pri}:row));
  const setRowText = (i,txt) => setRows(r=>r.map(row=>row._idx===i?{...row,text:txt}:row));

  const sel    = rows.filter(r=>r.selected);
  const allChk = sel.length === rows.length && rows.length > 0;
  const now    = new Date().toISOString().split('T')[0];

  const doAdd = () => onComplete(sel.map((r,i)=>({
    number:`Q${String(i+1).padStart(2,'0')}`,
    text:      r.text,
    category:  r.category,
    priority:  r.priority,
    status:    'pending',
    submittedAt: now,
    answer: null, answeredAt: null, answeredBy: null, documentRef: null,
  })));

  // ── Intro ──
  if(step === 'intro') return (
    <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',padding:48}}>
      <div style={{width:'100%',maxWidth:460}}>
        <button onClick={onCancel} style={{display:'flex',alignItems:'center',gap:6,color:C.t2,background:'none',border:'none',cursor:'pointer',fontSize:13,marginBottom:24,padding:0}}>
          <Ico.ArrowL size={16}/> Back
        </button>

        <div style={{width:52,height:52,borderRadius:14,background:'linear-gradient(135deg,#485ef0 0%,#7c6fff 100%)',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:18,boxShadow:'0 4px 16px rgba(72,94,240,0.28)'}}>
          <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff">
            <path d="M12 2l1.09 3.26L16.5 4.5l-2.26 2.26L15.5 10l-3.5-2-3.5 2 1.26-3.24L7.5 4.5l3.41.74L12 2z"/>
            <path d="M5 12l.72 2.16L8 15l-2.28.84L5 18l-.72-2.16L2 15l2.28-.84L5 12z" opacity=".75"/>
            <path d="M19 12l.48 1.44L21 14l-1.52.56L19 16l-.48-1.44L17 14l1.52-.56L19 12z" opacity=".6"/>
          </svg>
        </div>

        <h2 style={{fontSize:17,fontWeight:600,color:C.t1,marginBottom:8}}>AI-assisted question suggestions</h2>
        <p style={{fontSize:13,color:C.t2,lineHeight:1.65,marginBottom:20}}>
          The AI agent will review the deal materials currently available to you and suggest questions you should be asking — prioritized by deal significance and gaps in what's been disclosed so far.
        </p>

        <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:22}}>
          {[
            ['Works from your access','Suggestions are based only on the documents and sections you can currently see — no assumptions about restricted content.'],
            ['Flags disclosure gaps','Questions are generated where the AI detects missing, incomplete, or inconsistent information in the data room.'],
            ['Calibrated to deal type','The agent factors in typical M&A diligence checklists for this type of transaction to ensure nothing material is missed.'],
            ['You choose what to submit','Review every suggestion before it enters the queue. Edit, reprioritize, or discard anything that doesn\'t apply.'],
          ].map(([title,desc])=>(
            <div key={title} style={{display:'flex',gap:10,padding:'9px 12px',border:`1px solid ${C.border}`,borderRadius:8,background:'#fafafa'}}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={C.primary} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0,marginTop:1}}>
                <polyline points="20 6 9 17 4 12"/>
              </svg>

            <path d="M12 2l1.09 3.26L16.5 4.5l-2.26 2.26L15.5 10l-3.5-2-3.5 2 1.26-3.24L7.5 4.5l3.41.74L12 2z"/>
          </svg>

    `Risk factors identified during the review period include macroeconomic headwinds in key markets, regulatory changes in the EU jurisdiction, and supply chain fragility stemming from geopolitical instability. Each risk has been assigned an owner and a formal mitigation plan.`,
  ],
  xlsx: [
    `Financial Data Summary — This workbook contains consolidated financial data across all business units for the reporting period. Sheet tabs are organized by cost center. Figures are presented in USD thousands unless otherwise noted.`,
    `Revenue recognition follows ASC 606 guidelines. Deferred revenue balances are reflected in the balance sheet tab. All inter-company eliminations have been applied. Variance analysis versus prior period and budget is included in the Commentary tab.`,
    `Material variances exceeding 10% or $500K require CFO sign-off per internal policy FIN-22. Three line items in Q3 exceed this threshold and are flagged in column N. Supporting documentation has been attached to the relevant cells.`,
  ],
  pptx: [
    `Slide 1: Strategic Overview — This presentation has been prepared for internal distribution only. It contains forward-looking statements that involve risks and uncertainties. Actual results may differ materially from those projected.`,
    `Slide 4: Market Opportunity — Total addressable market is estimated at $4.2B growing at 14% CAGR through 2027. Our current market share of 8.3% represents significant headroom for expansion assuming successful execution of the product roadmap.`,
    `Slide 9: Implementation Timeline — Phase 1 deliverables are on track for Q2 completion. Phase 2 has been delayed by approximately 6 weeks due to resource constraints in the engineering organization. Revised go-live date is now targeted for November.`,
  ],
  folder: [
    `Folder Contents: This folder contains 14 documents across 3 sub-categories. Last modified by Sarah Williams on 04/02/2026. Total uncompressed size: 342 MB.`,
  ],
};

const genAiResponse = text => {
  const t = text.toLowerCase();
  if(t.includes('risk')||t.includes('mitigation'))
    return 'This passage covers identified risk factors with formal mitigation plans assigned to each. The three primary categories — macroeconomic headwinds, regulatory shifts, and supply chain fragility — are each material. Worth flagging the supply chain exposure to your deal team before close.';
  if(t.includes('revenue')||t.includes('asc 606')||t.includes('deferred'))
    return 'Revenue recognition follows ASC 606. The deferred revenue balance signals advance payments for services not yet delivered — common in SaaS or subscription models. Confirm the deferred balance schedule in the Financial Statements tab (section 4.1) to understand velocity.';
  if(t.includes('capital')||t.includes('budget')||t.includes('allocation'))
    return 'Capital is split 42% digital infrastructure, 28% talent, 30% APAC expansion. The APAC weighting is significant — verify whether regulatory approvals are in place for that region and whether the expansion timeline is reflected in the forecasting model (section 4.3).';
  if(t.includes('phase')||t.includes('timeline')||t.includes('deliver')||t.includes('delay'))
    return 'Phase 2 has slipped ~6 weeks due to engineering resource constraints. A November go-live is now the target. Ask management for the contingency plan if this slips again — a late Phase 2 could affect the revenue recognition schedule and Q4 projections.';
  if(t.includes('environmental')||t.includes('habitat')||t.includes('groundwater'))
    return 'Three risk categories are flagged: groundwater (moderate), air quality (low-moderate), and habitat disruption (high). The habitat rating is the most significant — it may require a third-party independent audit before close. Recommend escalating to environmental counsel.';
  if(t.includes('audit')||t.includes('deloitte')||t.includes('financial statement'))
    return 'FY2022 and FY2023 are audited; FY2024 is in-progress with Deloitte. Confirm the expected completion date for the FY2024 audit and whether any material adjustments from prior-year management estimates are anticipated.';
  return `This excerpt appears relevant to ${['the company\'s financial position','operational structure','legal or compliance framework','strategic direction'][text.length%4]}. Cross-referencing with the rest of the data room may surface related disclosures. Would you like me to search for related documents?`;
};

const DocPreviewPanel = ({ doc, docs, onClose, onNav, onAskFromDoc, onGoToQA }) => {

  const [aiPanel,   setAiPanel] = useState(null);  // {text, response} | null
  const contentRef = useRef(null);

  // Only cycle through file docs, not folder rows
  const fileDocs = docs.filter(d => d.type !== 'folder');
  const idx      = fileDocs.findIndex(d => d.id === doc.id);
  const hasPrev  = idx > 0;
  const hasNext  = idx < fileDocs.length - 1;
  const goPrev   = () => { if(hasPrev){ setZoom(95); onNav(fileDocs[idx - 1]); } };
  const goNext   = () => { if(hasNext){ setZoom(95); onNav(fileDocs[idx + 1]); } };

  const contentKey = doc.type==='folder'?'folder': doc.type==='ph'?'docx': doc.type||'docx';
  const paras = DOC_CONTENT[contentKey]||DOC_CONTENT.docx;

  const shortName = doc.name.length>28 ? doc.name.slice(0,26)+'…' : doc.name;

  // ── Selection detection ──

    setTimeout(() => {
      const sel = window.getSelection();
      const text = sel?.toString().trim();
      if (!text || text.length < 4) { setSelMenu(null); return; }
      try {
        const rect = sel.getRangeAt(0).getBoundingClientRect();
        setSelMenu({ x: rect.left + rect.width / 2, y: rect.top, text });
      } catch(e) { setSelMenu(null); }
    }, 10);
  };

  useEffect(() => {
    const dismiss = e => {
      if (e.target.closest && e.target.closest('[data-sel-menu]')) return;
      setSelMenu(null);
    };
    document.addEventListener('mousedown', dismiss);
    return () => document.removeEventListener('mousedown', dismiss);
  }, []);

  const doAskQuestion = () => {
    const text = selMenu.text;
    setSelMenu(null);
    window.getSelection()?.removeAllRanges();
    setAskPanel({ text, note: '' });
    setAiPanel(null);
  };

  const doAskAssistant = () => {
    const text = selMenu.text;
    setSelMenu(null);
    window.getSelection()?.removeAllRanges();

const FolderIcon = ({color='#9ca3af'}) => (
  <svg width="14" height="14" viewBox="0 0 24 24" fill={color} style={{flexShrink:0}}>
    <path d="M3 7a2 2 0 0 1 2-2h3.172a2 2 0 0 1 1.414.586l1.828 1.828A2 2 0 0 0 12.828 8H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
  </svg>
);

// ─── Recursive Tree Node ──────────────────────────────────────────────────────
const TreeNode = ({node, depth, sel, setSel, opens, toggleOpen, setCk, setPrev}) => {
  const isOpen   = opens.has(node.key);
  const isActive = sel === node.key;
  const hasKids  = node.children?.length > 0;
  // check if any descendant is active (1 or 2 levels deep)
  const descActive = hasKids && node.children.some(c =>
    c.key === sel || c.children?.some(cc => cc.key === sel)
  );
  const indent = 10 + depth * 16;
  return (
    <>
      <button
        onClick={()=>{ if(hasKids) toggleOpen(node.key); setSel(node.key); setCk(new Set()); setPrev(null); }}
        style={{width:'100%',padding:`4px 10px 4px ${indent}px`,display:'flex',alignItems:'center',gap:5,
          border:'none',cursor:'pointer',textAlign:'left',
          background:isActive?C.primaryLt:'none'}}
        onMouseEnter={e=>{if(!isActive)e.currentTarget.style.background=C.bgAlt;}}
        onMouseLeave={e=>{if(!isActive)e.currentTarget.style.background='none';}}>
        {hasKids ? (
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"
            style={{transform:isOpen?'rotate(90deg)':'rotate(0deg)',transition:'transform 0.15s',flexShrink:0,color:C.t3}}>
            <path d="M9 18l6-6-6-6"/>
          </svg>
        ) : <span style={{width:11,flexShrink:0}}/>}
        <FolderIcon color={isActive||descActive ? C.primary : depth===0 ? '#9ca3af' : '#bbbec4'}/>
        <span style={{fontSize:13,color:isActive?C.primary:depth>0?C.t2:C.t1,
          fontWeight:isActive||descActive?500:400,
          overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
          {node.num}{depth===0?'.':''} {node.label}
        </span>
      </button>
      {hasKids && isOpen && node.children.map(child=>(
        <TreeNode key={child.key} node={child} depth={depth+1} sel={sel} setSel={setSel}
          opens={opens} toggleOpen={toggleOpen} setCk={setCk} setPrev={setPrev}/>
      ))}
    </>
  );
};

// ─── Documents Tab ────────────────────────────────────────────────────────────
const DocumentsTab = ({ onAskFromDoc, onGoToQA, docToFocus, onDocFocused }) => {
  const { useEffect: useEffectDT } = React;
  const [railOpen,     setRailOpen]   = useState(true);
  const [openSections, setOpenSects]  = useState(new Set(['corp-gov']));
  const [selFolder,    setSelFolder]  = useState('corp-gov');
  const [checked,      setChecked]    = useState(new Set());
  const [hovRow,       setHovRow]     = useState(null);
  const [previewDoc,   setPreviewDoc] = useState(null);

  // Auto-open a doc when navigated here from the AI source link
  useEffectDT(() => {
    if(!docToFocus) return;
    // Search all sections for a doc whose name matches (fuzzy: includes)
    for(const [sectionKey, docs] of Object.entries(DOCS_BY_SECTION)){
      const match = docs.find(d => d.name.toLowerCase().includes(docToFocus.toLowerCase()) || docToFocus.toLowerCase().includes(d.name.toLowerCase()));
      if(match){
        setSelFolder(sectionKey);
        setPreviewDoc(match);
        break;
      }
    }
    onDocFocused && onDocFocused();
  }, [docToFocus]);

  const docs = DOCS_BY_SECTION[selFolder] || DOCS_BY_SECTION['corp-gov'];
  const allChk = checked.size === docs.length && docs.length > 0;
  const toggleAll = () => setChecked(allChk ? new Set() : new Set(docs.map(d=>d.id)));
  const toggleOne = id => setChecked(prev => { const n=new Set(prev); n.has(id)?n.delete(id):n.add(id); return n; });

  const toggleSection = key => setOpenSects(prev => {
    const n = new Set(prev);
    n.has(key) ? n.delete(key) : n.add(key);
    return n;
  });

  // Derive breadcrumb from selected folder (up to 3 levels deep)
  const breadcrumb = (() => {
    for(const sec of DEAL_TREE){
      if(sec.key===selFolder) return ['Index', sec.label];
      if(sec.children){
        for(const child of sec.children){
          if(child.key===selFolder) return ['Index', sec.label, child.label];
          if(child.children){
            const grand = child.children.find(cc=>cc.key===selFolder);
            if(grand) return ['Index', sec.label, child.label, grand.label];

    return ['Index'];

    { label:'Action Required',

    { label:'Downloads',
      icon:<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><line x1="12" y1="15" x2="12" y2="3"/></svg> },
    { label:'Recycle Bin',

  ];

              <col style={{width:72}}/>
              <col style={{width:'auto'}}/>
              <col style={{width:64}}/>
              <col style={{width:136}}/>
              <col style={{width:32}}/>
              <col style={{width:84}}/>
              <col style={{width:140}}/>

            <thead style={{position:'sticky',top:0,zIndex:2}}>

                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={C.t3} strokeWidth="1.75" strokeLinecap="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>

                <th style={{padding:'8px 4px',textAlign:'center'}}>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={C.t3} strokeWidth="1.75" strokeLinecap="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                </th>
                {[['Index','left'],['Name','left'],['Type','left'],['Status','left']].map(([h,a])=>(
                  <th key={h} style={{padding:'8px',textAlign:a,fontSize:12,fontWeight:500,color:C.t2,whiteSpace:'nowrap'}}>
                    <div style={{display:'flex',alignItems:'center',gap:4}}>
                      {h}
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style={{color:C.t3,opacity:0.7}}><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
                    </div>
                  </th>
                ))}
                <th style={{padding:'8px 4px',textAlign:'center'}}>
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke={C.t3} strokeWidth="1.75" strokeLinecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </th>
                {[['Size','right'],['Date Available','left']].map(([h,a])=>(
                  <th key={h} style={{padding:'8px',textAlign:a,fontSize:12,fontWeight:500,color:C.t2,whiteSpace:'nowrap'}}>
                    <div style={{display:'flex',alignItems:'center',gap:4,justifyContent:a==='right'?'flex-end':'flex-start'}}>
                      {h}
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style={{color:C.t3,opacity:0.7}}><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
                    </div>
                  </th>
                ))}
              </tr>
              {/* Filter row */}
              <tr style={{background:'#fff',borderBottom:`1px solid ${C.border}`}}>
                <td colSpan={3} style={{padding:'4px 12px',textAlign:'center'}}>{filterFunnelSVG}</td>
                <td style={{padding:'3px 8px'}}>
                  <div style={{display:'flex',alignItems:'center',gap:3}}>
                    {filterFunnelSVG}
                    <input style={{width:'100%',border:`1px solid ${C.border}`,borderRadius:3,padding:'2px 5px',fontSize:10,outline:'none',color:C.t1}} placeholder=""/>
                    {filterFunnelSVG}
                  </div>
                </td>
                <td style={{padding:'3px 8px'}}>
                  <div style={{display:'flex',alignItems:'center',gap:3}}>
                    <input style={{width:'100%',border:`1px solid ${C.border}`,borderRadius:3,padding:'2px 5px',fontSize:10,outline:'none',color:C.t1}} placeholder=""/>
                    {filterFunnelSVG}
                  </div>
                </td>
                <td style={{padding:'3px 8px'}}>
                  <div style={{display:'flex',alignItems:'center',gap:3}}>
                    <input style={{width:'100%',border:`1px solid ${C.border}`,borderRadius:3,padding:'2px 5px',fontSize:10,outline:'none'}} placeholder=""/>
                    {filterFunnelSVG}
                  </div>
                </td>
                <td style={{padding:'3px 8px'}}>
                  <div style={{display:'flex',alignItems:'center',gap:3}}>
                    <input style={{width:'100%',border:`1px solid ${C.border}`,borderRadius:3,padding:'2px 5px',fontSize:10,outline:'none'}} placeholder=""/>
                    {filterFunnelSVG}
                  </div>
                </td>
                <td colSpan={3}/>
              </tr>
            </thead>
            <tbody>
              {docs.map(doc=>{
                const isHov = hovRow===doc.id;
                const isChk = checked.has(doc.id);
                return (
                  <tr key={doc.id}
                    style={{borderBottom:`1px solid ${C.border}`,background:previewDoc?.id===doc.id?C.primaryLt:isChk?'#f0f4fe':isHov?C.bgAlt:'#fff',cursor:'pointer',transition:'background 0.08s'}}
                    onMouseEnter={()=>setHovRow(doc.id)}
                    onMouseLeave={()=>setHovRow(null)}
                    onClick={()=>{ if(doc.type!=='folder') setPreviewDoc(previewDoc?.id===doc.id?null:doc); }}
                    onDoubleClick={()=>{ if(doc.type==='folder'&&doc.navKey){ setSelFolder(doc.navKey); setChecked(new Set()); setPreviewDoc(null); } }}>
                    {/* Checkbox */}
                    <td style={{padding:'9px 8px 9px 12px',textAlign:'center'}} onClick={e=>e.stopPropagation()}>
                      <input type="checkbox" checked={isChk} onChange={()=>{ toggleOne(doc.id); setPreviewDoc(doc); }}/>
                    </td>
                    {/* Star */}
                    <td style={{padding:'9px 4px',textAlign:'center'}}>
                      <svg width="12" height="12" viewBox="0 0 24 24"
                        fill={doc.starred?'#f59e0b':'none'}
                        stroke={doc.starred?'#f59e0b':C.t3}
                        strokeWidth="1.75" strokeLinecap="round">
                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                      </svg>
                    </td>
                    {/* Note */}
                    <td style={{padding:'9px 4px',textAlign:'center'}}>
                      {doc.hasNote&&<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke={C.t2} strokeWidth="1.75" strokeLinecap="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>}
                    </td>
                    {/* Index */}
                    <td style={{padding:'9px 8px',fontFamily:'monospace',fontSize:12,color:C.t2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{doc.index}</td>
                    {/* Name */}
                    <td style={{padding:'9px 8px',overflow:'hidden'}}>
                      <div style={{display:'flex',alignItems:'center',gap:7,overflow:'hidden'}}>
                        <DocTypeIcon type={doc.type}/>
                        <span style={{color:C.t1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{doc.name}</span>
                      </div>
                    </td>
                    {/* Type */}
                    <td style={{padding:'9px 8px',color:C.t2,fontSize:12,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{doc.type!=='ph'?doc.type:''}</td>
                    {/* Status */}
                    <td style={{padding:'9px 8px',overflow:'hidden'}}><DocStatus status={doc.status}/></td>
                    {/* Edit (hover) */}
                    <td style={{padding:'9px 4px',textAlign:'center'}}>
                      {isHov&&<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke={C.t2} strokeWidth="1.75" strokeLinecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>}
                    </td>
                    {/* Size */}
                    <td style={{padding:'9px 8px',color:C.t2,fontSize:12,textAlign:'right',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{doc.size}</td>
                    {/* Date */}
                    <td style={{padding:'9px 8px',color:C.t2,fontSize:12,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{doc.date}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        {/* Bottom status bar */}
        <div style={{padding:'8px 16px',borderTop:`1px solid ${C.border}`,background:'#fff',flexShrink:0,minHeight:36,display:'flex',alignItems:'center'}}>
          {checked.size===0 ? (
            <span style={{fontSize:12,color:C.t3}}>Please select at least one item from the grid to see details.</span>
          ) : (
            <div style={{display:'flex',alignItems:'center',gap:16}}>
              <span style={{fontSize:12,color:C.t2}}>{checked.size} item{checked.size!==1?'s':''} selected</span>
              {['Download','Share','Move','Delete'].map(a=>(
                <button key={a} style={{fontSize:12,color:a==='Delete'?'#dc2626':C.primary,background:'none',border:'none',cursor:'pointer',padding:'2px 8px',borderRadius:4,fontWeight:500}}
                  onMouseEnter={e=>e.currentTarget.style.background=a==='Delete'?'#fef2f2':C.primaryLt}
                  onMouseLeave={e=>e.currentTarget.style.background='none'}>{a}</button>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* ── Preview panel ── */}
      {previewDoc && (
        <DocPreviewPanel
          doc={previewDoc}
          docs={docs}
          onClose={()=>setPreviewDoc(null)}
          onNav={d=>setPreviewDoc(d)}
          onAskFromDoc={onAskFromDoc}
          onGoToQA={onGoToQA}
        />
      )}

      </div>{/* end content+preview wrapper */}
    </div>
  );
};

// ─── App Root ─────────────────────────────────────────────────────────────────
const App = () => {
  const [tab,       setTab]      = useState('docs'); // 'docs' | 'qa'
  const [pendingDocQ,  setPendingDocQ]  = useState(null); // question submitted from doc viewer
  const [docToFocus,   setDocToFocus]   = useState(null); // doc name to auto-open in Documents tab
  const [qaSubTab,  setQaSubTab] = useState('requests'); // 'requests' | 'faq'
  const [role,      setRole]     = useState('admin');
  const [launched,  setLaunched] = useState(false);
  const [showSetup, setShowSetup]= useState(false);
  const [showAsk,   setShowAsk]  = useState(false);
  const [qs,        setQs]       = useState([]);
  const [faqs,      setFaqs]     = useState(FAQ_SEED);
  const [rvMode,    setRvMode]   = useState('empty'); // empty | import | active
  const nid = useRef(100);

  const launch = (_config) => { setLaunched(true); setShowSetup(false); };

  const imported = items => {
    const now = new Date().toISOString().split('T')[0];
    setQs(prev=>[...prev,...items.map((q,i)=>({
      id:nid.current++,...q,
      status: i<3?'answered':i<6?'in-progress':'pending',
      submittedBy: QUESTION_POOL[i%3],
      submittedAt: now,
      answer: i<3?'The requested documents have been uploaded to the corresponding section in the data room.':null,
      answeredAt: i<3?now:null,
      answeredBy: i<3?ANSWER_POOL[i%3]:null,
      documentRef: i<2?{name:DOCS[i]}:null,
    }))]);
    setRvMode('active');
  };

  const asked = data => {
    const now = new Date().toISOString().split('T')[0];
    setQs(prev=>[...prev,{id:nid.current++,number:`Q${String(prev.length+1).padStart(2,'0')}`,
      ...data,status:'pending',submittedAt:now,answer:null,answeredAt:null,answeredBy:null}]);
    if(rvMode==='empty') setRvMode('active');
  };

  const answered = (id,text) => {
    const now = new Date().toISOString().split('T')[0];
    setQs(prev=>prev.map(q=>q.id===id?{...q,status:'answered',answer:text,answeredAt:now,answeredBy:ANSWER_POOL[0]}:q));
  };

  const markedIP = id => setQs(prev=>prev.map(q=>q.id===id?{...q,status:'in-progress'}:q));

  const switchRole = r => {
    setRole(r);
    if(r==='reviewer'&&launched&&qs.length>0) setRvMode('active');
    if(r==='reviewer'&&launched&&qs.length===0) setRvMode('empty');
  };

  // Called when a reviewer submits a question directly from the doc viewer
  // Auto-launches Q&A if not already launched; returns true if auto-setup occurred
  const handleAskFromDoc = ({ text, note, docRef, category, highPriority }) => {
    const wasAutoSetup = !launched;
    const now = new Date().toISOString().split('T')[0];
    const qText = note && note.trim() ? note.trim() : text;
    setQs(prev=>[...prev,{
      id: nid.current++,
      number: `Q${String(prev.length+1).padStart(2,'0')}`,
      text: qText,
      category: category || 'General',
      priority: highPriority ? 'high' : 'normal',
      status: 'pending',
      submittedBy: QUESTION_POOL[0],
      submittedAt: now,
      answer: null,
      answeredAt: null,
      answeredBy: null,
      documentRef: docRef ? { name: docRef } : null,
      excerpt: text,
    }]);
    if(!launched) {
      setLaunched(true);
      setRvMode('active');
    }
    // Stash details so the Q&A tab can show a dialog when the user switches over
    setPendingDocQ({ text: qText, docRef, category: category || 'General', highPriority });
    return wasAutoSetup;
  };

  const userName = role==='admin'?'Nate Hull':'James Park';
  const submitter = role==='reviewer'?QUESTION_POOL[0]:ANSWER_POOL[0];

  const main = () => {
    if(role==='admin') {
      if(!launched) return <AdminEmpty onSetup={()=>setShowSetup(true)}/>;
      return <AdminActive qs={qs} onAnswer={answered} onMarkIP={markedIP} onSettings={()=>setShowSetup(true)} onOpenDoc={name=>{ setDocToFocus(name); setTab('docs'); }}/>;
    }
    if(!launched) return (
      <div className="flex-1 flex items-center justify-center">
        <div style={{textAlign:'center'}}><Ico.Clock size={32} cls="text-gray-200 mb-3"/><p style={{fontSize:13,color:C.t3}}>Q&amp;A hasn't been launched by the project admin yet.</p></div>
      </div>
    );
    const backFromAi = () => setRvMode(qs.length>0?'active':'empty');
    const aiAsked = items => {
      const now = new Date().toISOString().split('T')[0];
      setQs(prev=>{
        const base = prev.length;
        return [...prev, ...items.map((q,i)=>({
          id: nid.current++,
          number: `Q${String(base+i+1).padStart(2,'0')}`,
          ...q,
          submittedBy: QUESTION_POOL[0],
          submittedAt: now,
        }))];
      });
      setRvMode('active');
    };
    if(rvMode==='import')    return <IRLImport onComplete={imported} onCancel={()=>setRvMode(qs.length>0?'active':'empty')} existingQs={qs}/>;
    if(rvMode==='ai-assist') return <ReviewerAiAssist onComplete={aiAsked} onCancel={backFromAi}/>;
    if(rvMode==='active')    return <ReviewerActive qs={qs} onImport={()=>setRvMode('import')} onAsk={()=>setShowAsk(true)} onAiAssist={()=>setRvMode('ai-assist')}/>;
    return <ReviewerEmpty onImport={()=>setRvMode('import')} onAsk={()=>setShowAsk(true)} onAiAssist={()=>setRvMode('ai-assist')}/>;
  };

  return (
    <div style={{height:'100%',display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <TopNav role={role} onRoleChange={switchRole} qaLive={launched} userName={userName}/>

      <div style={{flex:1,display:'flex',overflow:'hidden'}}>
        {/* Sidebar — matches Datasite LeftNav spec exactly */}
        <nav style={{width:80,borderRight:`1px solid ${C.border}`,display:'flex',flexDirection:'column',alignItems:'center',background:'#fff',flexShrink:0}}>
          {[
            { label:'Documents', tabKey:'docs',
              icon: (
                <svg width="22" height="18" viewBox="0 0 22 18" fill="none">
                  {/* file-lines light */}
                  <path d="M3.5 1.25h9.379L18.75 7.621V16.25a1.25 1.25 0 0 1-1.25 1.25H3.5a1.25 1.25 0 0 1-1.25-1.25V2.5A1.25 1.25 0 0 1 3.5 1.25z" stroke="currentColor" strokeWidth="1.15" fill="none" strokeLinejoin="round"/>
                  <path d="M13 1.25V7.5h6.25" stroke="currentColor" strokeWidth="1.15" fill="none" strokeLinejoin="round"/>
                  <line x1="5.5" y1="10.5" x2="14.5" y2="10.5" stroke="currentColor" strokeWidth="1.15" strokeLinecap="round"/>
                  <line x1="5.5" y1="13.25" x2="14.5" y2="13.25" stroke="currentColor" strokeWidth="1.15" strokeLinecap="round"/>
                  <line x1="5.5" y1="7.75" x2="9" y2="7.75" stroke="currentColor" strokeWidth="1.15" strokeLinecap="round"/>
                </svg>
              ),
              iconActive: (
                <svg width="22" height="18" viewBox="0 0 22 18" fill="currentColor">
                  <path d="M3.5 0A2 2 0 0 0 1.5 2v14a2 2 0 0 0 2 2h15a2 2 0 0 0 2-2V7.5L14 0H3.5zm9 1.5V7h5.086L12.5 1.5zM5 10h10v1.5H5V10zm0 3h10v1.5H5V13zm0-6h3.5V8.5H5V7z"/>
                </svg>
              )
            },
            { label:'Search', tabKey:'search',
              icon: (
                <svg width="22" height="18" viewBox="0 0 22 18" fill="none">
                  {/* magnifying-glass light */}
                  <circle cx="9" cy="8.5" r="6.25" stroke="currentColor" strokeWidth="1.15"/>
                  <line x1="13.5" y1="13" x2="19.5" y2="17" stroke="currentColor" strokeWidth="1.15" strokeLinecap="round"/>
                </svg>
              ),
              iconActive: (
                <svg width="22" height="18" viewBox="0 0 22 18" fill="currentColor">
                  <path d="M9 1a7.5 7.5 0 1 0 4.33 13.62l4.84 4.84a1 1 0 0 0 1.41-1.41l-4.84-4.84A7.5 7.5 0 0 0 9 1zm0 1.5a6 6 0 1 1 0 12A6 6 0 0 1 9 2.5z"/>
                </svg>
              )
            },
            { label:'Q&A', tabKey:'qa',
              icon: (
                <svg width="22" height="18" viewBox="0 0 22 18" fill="none">
                  {/* comments light — two overlapping speech bubbles */}
                  <path d="M14.5 1.25H3.5A1.75 1.75 0 0 0 1.75 3v6c0 .966.784 1.75 1.75 1.75h1.25v2.75l3.25-2.75H14.5A1.75 1.75 0 0 0 16.25 9V3A1.75 1.75 0 0 0 14.5 1.25z" stroke="currentColor" strokeWidth="1.15" fill="none" strokeLinejoin="round"/>
                  <path d="M16.25 5.5h1.25C18.44 5.5 19.25 6.31 19.25 7.25v4.5a1.75 1.75 0 0 1-1.75 1.75h-.75v2.25l-2.75-2.25h-3a1.75 1.75 0 0 1-1.75-1.75v-.5" stroke="currentColor" strokeWidth="1.15" fill="none" strokeLinejoin="round"/>
                </svg>
              ),
              iconActive: (
                <svg width="22" height="18" viewBox="0 0 22 18" fill="currentColor">
                  <path d="M14.5 0H3.5A2.75 2.75 0 0 0 .75 2.75v6A2.75 2.75 0 0 0 3.5 11.5H4.5v3.25a.75.75 0 0 0 1.22.58L9.5 11.5H14.5a2.75 2.75 0 0 0 2.75-2.75v-6A2.75 2.75 0 0 0 14.5 0z"/>
                  <path d="M17.25 4.75H18a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-.5v2.5a.5.5 0 0 1-.82.38L14.5 13H11a2 2 0 0 1-2-2h5.5A2.75 2.75 0 0 0 17.25 8.25V4.75z" opacity="0.6"/>
                </svg>
              )
            },
          ].map(({ label, tabKey, icon, iconActive }) => {
            const active = tab === tabKey;
            return (
              <button key={label}
                onClick={() => setTab(tabKey)}
                style={{
                  width:'100%', height:68, border:'none', cursor:'pointer',
                  background:'transparent', display:'flex', flexDirection:'column',
                  alignItems:'center', justifyContent:'center', gap:4,
                  color: active ? C.primary : C.t1,
                }}
                onMouseEnter={e => { if(!active){ e.currentTarget.style.background=C.bgAlt; } }}
                onMouseLeave={e => { if(!active){ e.currentTarget.style.background='transparent'; } }}>
                {/* 32×32 icon container */}
                <div style={{
                  width:32, height:32, borderRadius:8,
                  background: active ? C.primaryLt : 'transparent',
                  display:'flex', alignItems:'center', justifyContent:'center',
                  flexShrink:0,
                }}>
                  {active ? iconActive : icon}
                </div>
                {/* Label */}
                <span style={{
                  fontFamily:'Roboto,sans-serif', fontWeight:400, fontSize:10,
                  letterSpacing:'0.4px', color: active ? C.primary : C.t1,
                  lineHeight:1, textAlign:'center',
                }}>
                  {label}
                </span>
              </button>
            );
          })}
        </nav>

        {/* Content */}
        <main style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
          {tab==='docs' ? (
            <DocumentsTab onAskFromDoc={handleAskFromDoc} onGoToQA={()=>setTab('qa')} docToFocus={docToFocus} onDocFocused={()=>setDocToFocus(null)}/>
          ) : tab==='search' ? (
            <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center'}}>
              <div style={{textAlign:'center'}}>
                <Ico.Search size={32} cls="text-gray-200 mb-3"/>
                <p style={{fontSize:13,color:C.t3}}>Full-text search — coming soon</p>
              </div>
            </div>
          ) : (
            <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
              {/* Q&A top bar with sub-tabs */}
              <div style={{display:'flex',alignItems:'stretch',justifyContent:'space-between',paddingLeft:24,paddingRight:24,borderBottom:`1px solid ${C.border}`,flexShrink:0,height:44}}>
                {/* Sub-tabs */}
                <div style={{display:'flex',alignItems:'stretch',gap:0}}>
                  {[{k:'requests',l:'Requests'},{k:'faq',l:'FAQ'}].map(({k,l})=>(
                    <button key={k} onClick={()=>setQaSubTab(k)}
                      style={{padding:'0 16px',border:'none',background:'none',cursor:'pointer',fontSize:13,
                        fontWeight:qaSubTab===k?500:400,
                        color:qaSubTab===k?C.primary:C.t2,
                        borderBottom:qaSubTab===k?`2px solid ${C.primary}`:'2px solid transparent',
                        transition:'color 0.1s'}}>
                      {l}
                    </button>
                  ))}
                </div>
                {/* Right side contextual info */}
                {qaSubTab==='requests'&&launched&&qs.length>0 && (
                  <div style={{display:'flex',alignItems:'center'}}>
                    <span style={{fontSize:12,color:C.t2}}>{qs.length} total request{qs.length!==1?'s':''}</span>
                  </div>
                )}
              </div>
              {/* Content */}
              {qaSubTab==='faq'
                ? <FaqPanel faqs={faqs} setFaqs={setFaqs} isAdmin={role==='admin'}/>
                : main()
              }
            </div>
          )}
        </main>
      </div>

      {showSetup&&<SetupModal onClose={()=>setShowSetup(false)} onLaunch={launch}/>}
      {showAsk&&<AskModal onClose={()=>setShowAsk(false)} onSubmit={asked} submitter={submitter} existingQs={qs}/>}

      {/* ── Doc-question forwarding notice (shown when buyer lands on Q&A tab) ── */}
      {pendingDocQ && tab==='qa' && (
        <div className="fade-in"
          style={{position:'fixed',inset:0,background:'rgba(13,27,42,0.45)',zIndex:9999,display:'flex',alignItems:'center',justifyContent:'center',padding:24,backdropFilter:'blur(2px)'}}
          onClick={()=>setPendingDocQ(null)}>
          <div style={{background:'#fff',borderRadius:14,boxShadow:'0 24px 64px rgba(0,0,0,0.22)',width:440,maxWidth:'100%',overflow:'hidden'}}
            onClick={e=>e.stopPropagation()}>

            {/* Header */}
            <div style={{padding:'18px 20px 14px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <div style={{width:34,height:34,borderRadius:9,background:C.primaryLt,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={C.primary} strokeWidth="2.2" strokeLinecap="round">
                    <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/>
                  </svg>
                </div>
                <div>
                  <p style={{fontSize:14,fontWeight:600,color:C.t1,margin:0}}>Question sent to the deal team</p>
                  <p style={{fontSize:11,color:C.t2,margin:'2px 0 0',lineHeight:1.4}}>They'll choose how to respond — Q&amp;A or directly.</p>
                </div>
              </div>
              <button onClick={()=>setPendingDocQ(null)}
                style={{background:'none',border:'none',cursor:'pointer',color:C.t3,padding:4,display:'flex',borderRadius:5,flexShrink:0}}
                onMouseEnter={e=>e.currentTarget.style.background=C.bgAlt}
                onMouseLeave={e=>e.currentTarget.style.background='none'}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
              </button>
            </div>

            {/* Body */}
            <div style={{padding:'16px 20px 20px'}}>

              {/* Question card */}
              <div style={{background:C.bgAlt,border:`1px solid ${C.border}`,borderRadius:8,padding:'10px 14px',marginBottom:16}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:5}}>
                  <span style={{fontSize:10,fontWeight:500,color:C.t3,textTransform:'uppercase',letterSpacing:'0.5px'}}>Your question</span>
                  <div style={{display:'flex',gap:5}}>
                    {pendingDocQ.highPriority && (
                      <span style={{fontSize:10,fontWeight:600,color:'#c2410c',background:'#fff7ed',border:'1px solid #fed7aa',borderRadius:3,padding:'1px 6px',display:'flex',alignItems:'center',gap:3}}>
                        <svg width="9" height="9" viewBox="0 0 24 24" fill="#f97316" stroke="none"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15" stroke="#f97316" strokeWidth="2"/></svg>
                        High priority
                      </span>
                    )}
                    {pendingDocQ.category && pendingDocQ.category !== 'General' && (
                      <span style={{fontSize:10,color:C.t2,background:'#f3f4f6',border:`1px solid ${C.border}`,borderRadius:3,padding:'1px 6px'}}>{pendingDocQ.category}</span>
                    )}
                  </div>
                </div>
                {pendingDocQ.docRef && (
                  <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:5}}>
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke={C.t3} strokeWidth="2" strokeLinecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    <span style={{fontSize:11,color:C.t2}}>{pendingDocQ.docRef}</span>
                  </div>
                )}
                <p style={{fontSize:12,color:C.t1,margin:0,lineHeight:1.55}}>"{pendingDocQ.text}"</p>
              </div>

              {/* What happens next — informational only, sell-side decides */}
              <p style={{fontSize:10,fontWeight:600,color:C.t3,textTransform:'uppercase',letterSpacing:'0.6px',margin:'0 0 8px'}}>What happens next</p>
              <p style={{fontSize:12,color:C.t2,margin:'0 0 12px',lineHeight:1.6}}>
                The deal team will decide how to respond — that's their call to make. You don't need to do anything else.
              </p>
              <div style={{background:C.bgAlt,border:`1px solid ${C.border}`,borderRadius:8,padding:'12px 14px',marginBottom:20}}>
                <div style={{display:'flex',flexDirection:'column',gap:8}}>
                  <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={C.t2} strokeWidth="2" strokeLinecap="round" style={{flexShrink:0,marginTop:2}}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    <div>
                      <div><span style={{fontSize:12,fontWeight:500,color:C.t1}}>Via Q&amp;A </span><span style={{fontSize:12,color:C.t2}}>— answer will appear in this module</span></div>
                      <div style={{display:'flex',alignItems:'center',gap:5,marginTop:4}}>
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke={C.t3} strokeWidth="2" strokeLinecap="round" style={{flexShrink:0}}><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        <span style={{fontSize:11,color:C.t2}}>You'll also get an email notification when the answer is posted.</span>
                      </div>
                    </div>
                  </div>
                  <div style={{height:1,background:C.border}}/>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={C.t2} strokeWidth="2" strokeLinecap="round" style={{flexShrink:0}}><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    <div>
                      <span style={{fontSize:12,fontWeight:500,color:C.t1}}>Directly </span>
                      <span style={{fontSize:12,color:C.t2}}>— they may reach out by email or outside the data room</span>
                    </div>
                  </div>
                </div>
              </div>

              {/* Dismiss */}
              <button onClick={()=>setPendingDocQ(null)}
                style={{width:'100%',padding:'10px 0',background:C.primary,color:'#fff',border:'none',borderRadius:8,fontSize:13,fontWeight:500,cursor:'pointer',letterSpacing:'0.1px'}}
                onMouseEnter={e=>e.currentTarget.style.background=C.primaryHov}
                onMouseLeave={e=>e.currentTarget.style.background=C.primary}>
                Got it
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Prototype watermark */}
      <div style={{position:'fixed',bottom:12,left:'50%',transform:'translateX(-50%)',background:'rgba(31,34,39,0.75)',color:'rgba(255,255,255,0.8)',fontSize:11,padding:'4px 12px',borderRadius:20,pointerEvents:'none',backdropFilter:'blur(4px)',userSelect:'none'}}>
        Prototype · Datasite Q&A — Diligence thin slice
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
