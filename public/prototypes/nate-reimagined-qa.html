const DetailPanel = ({ q, onClose, onAnswer, onMarkIP, isAdmin, onOpenDoc }) => {
  const { useEffect, useRef } = React;
  const [ans,            setAns]            = useState('');
  const [submitting,     setSubmitting]     = useState(false);
  const [showWorkflow,   setShowWorkflow]   = useState(false);
  const [aiSuggestion,   setAiSuggestion]   = useState(null);   // {answer, source, sourceType}
  const [aiLoading,      setAiLoading]      = useState(false);
  const [aiDismissed,    setAiDismissed]    = useState(false);
  // Attachments
  const [attachments,    setAttachments]    = useState([]);
  const [attachMode,     setAttachMode]     = useState(null); // null | 'existing' | 'upload'
  const [attachSearch,   setAttachSearch]   = useState('');
  const [uploadName,     setUploadName]     = useState('');
  const [uploadFolder,   setUploadFolder]   = useState(VDR_FOLDERS[0]?.key || '');

  // ── Follow-up thread state ──
  const [threads,        setThreads]        = useState([]);
  const [threadText,     setThreadText]     = useState('');
  const [taggedPeople,   setTaggedPeople]   = useState([]);
  const [showTagPicker,  setShowTagPicker]  = useState(false);
  const [mentionQuery,   setMentionQuery]   = useState('');
  const threadRef = useRef(null);

  // Dismiss tag picker on outside click
  useEffect(() => {
    const handler = e => { if(!e.target.closest('[data-tag-area]')) setShowTagPicker(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  // Generate AI suggested answer when question changes (admin + unanswered only)
  useEffect(() => {
    if(!isAdmin || q.answer) return;
    setAiSuggestion(null);
    setAiDismissed(false);
    setAiLoading(true);
    const t = setTimeout(() => {
      setAiSuggestion(genSuggestedAnswer(q));
      setAiLoading(false);
    }, 900);
    return () => clearTimeout(t);
  }, [q.id]);

  const handleThreadChange = e => {
    const val = e.target.value;
    setThreadText(val);
    const lastAt = val.lastIndexOf('@');
    if(lastAt !== -1) {
      const after = val.slice(lastAt + 1);
      if(!after.includes(' ')) { setShowTagPicker(true); setMentionQuery(after.toLowerCase()); return; }
    }
    setShowTagPicker(false);
  };

  const tagPerson = person => {
    const lastAt = threadText.lastIndexOf('@');
    setThreadText(threadText.slice(0, lastAt) + `@${person.name} `);
    setTaggedPeople(prev => prev.find(p=>p.id===person.id) ? prev : [...prev, person]);
    setShowTagPicker(false);
    threadRef.current?.focus();
  };

  const untag = id => setTaggedPeople(prev => prev.filter(p => p.id !== id));

  const submitThread = () => {
    if(!threadText.trim()) return;
    const now = new Date().toISOString().split('T')[0];
    setThreads(prev => [...prev, {
      id: Date.now(),
      text: threadText.trim(),
      mentions: [...taggedPeople],
      by: isAdmin ? ANSWER_POOL[0] : QUESTION_POOL[0],
      at: now,
    }]);
    setThreadText('');
    setTaggedPeople([]);
  };

  const doAnswer = () => {
    if(!ans.trim()) return;
    setSubmitting(true);
    setTimeout(()=>{onAnswer(q.id,ans);setSubmitting(false);},700);
  };

  return (
    <div style={{width:384,borderLeft:`1px solid ${C.border}`,flexShrink:0}} className="bg-white flex flex-col fade-in">
      {/* Header */}
      <div className="flex items-center justify-between px-5 py-3" style={{borderBottom:`1px solid ${C.border}`}}>
        <div className="flex items-center gap-2">
          <span style={{fontFamily:'monospace',fontSize:11,color:C.t2,background:C.bgAlt,padding:'2px 6px',borderRadius:4}}>#{q.number}</span>
          <StatusBadge s={q.status}/>
          <Pip p={q.priority}/>
        </div>
        <button onClick={onClose} style={{color:C.t3}} className="hover:text-gray-600"><Ico.X size={16}/></button>
      </div>

      <div className="flex-1 overflow-y-auto">
        {/* Question */}
        <div className="px-5 py-4" style={{borderBottom:`1px solid ${C.border}`}}>
          <div style={{fontSize:11,fontWeight:500,color:C.t3,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:8}}>Question</div>
          <p style={{fontSize:13,color:C.t1,lineHeight:1.6,margin:0}}>{q.text}</p>
        </div>

        {/* Meta */}
        <div className="px-5 py-4" style={{borderBottom:`1px solid ${C.border}`,display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <div>
            <div style={{fontSize:11,color:C.t3,marginBottom:6}}>Submitted by</div>
            <div className="flex items-center gap-2"><Avatar m={q.submittedBy} size="sm"/><span style={{fontSize:12,color:C.t1}}>{q.submittedBy.name}</span></div>
          </div>
          <div>
            <div style={{fontSize:11,color:C.t3,marginBottom:6}}>Category</div>
            <CatTag cat={q.category}/>
          </div>
          <div>
            <div style={{fontSize:11,color:C.t3,marginBottom:6}}>Priority</div>
            <div className="flex items-center gap-1.5"><Pip p={q.priority}/><span style={{fontSize:12,color:C.t1,textTransform:'capitalize'}}>{q.priority}</span></div>
          </div>
          <div>
            <div style={{fontSize:11,color:C.t3,marginBottom:6}}>Date</div>
            <span style={{fontSize:12,color:C.t1}}>{q.submittedAt}</span>
          </div>
        </div>

        {/* Doc ref */}
        {q.documentRef && (
          <div className="px-5 py-4" style={{borderBottom:`1px solid ${C.border}`}}>
            <div style={{fontSize:11,fontWeight:500,color:C.t3,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:8}}>Referenced Document</div>
            <div className="flex items-center gap-2" style={{background:C.primaryLt,border:`1px solid ${C.primaryBd}`,borderRadius:6,padding:'8px 10px',fontSize:12,color:C.primary}}>
              <Ico.Link size={12}/>{q.documentRef.name}
            </div>
          </div>
        )}

        {/* Answer section */}
        <div className="px-5 py-4">
          {q.answer ? (
            <>
              <div style={{fontSize:11,fontWeight:500,color:C.t3,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:8}}>Answer</div>
              <div style={{background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:8,padding:12}}>
                <p style={{fontSize:13,color:C.t1,lineHeight:1.6,margin:0}}>{q.answer}</p>
                <div className="flex items-center gap-2 mt-3 pt-2.5" style={{borderTop:'1px solid #bbf7d0'}}>
                  <Avatar m={q.answeredBy} size="sm"/>
                  <span style={{fontSize:11,color:C.t2}}>{q.answeredBy.name} · {q.answeredAt}</span>
                </div>
              </div>

              {/* ── Follow-up thread ── */}
              <div style={{marginTop:16}}>
                {/* Existing thread messages */}
                {threads.length > 0 && (
                  <div style={{marginBottom:12,display:'flex',flexDirection:'column',gap:10}}>
                    {threads.map(t => (
                      <div key={t.id} style={{display:'flex',gap:8,alignItems:'flex-start'}}>
                        <Avatar m={t.by} size="sm"/>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{display:'flex',alignItems:'baseline',gap:6,marginBottom:4}}>
                            <span style={{fontSize:12,fontWeight:500,color:C.t1}}>{t.by.name}</span>
                            <span style={{fontSize:10,color:C.t3}}>{t.at}</span>
                          </div>
                          <div style={{background:C.bgAlt,borderRadius:6,padding:'7px 10px',fontSize:12,color:C.t1,lineHeight:1.55}}>
                            {t.text.split(/(@[\w\s]+?)(?=\s|$)/g).map((part,pi) =>
                              part.startsWith('@')
                                ? <span key={pi} style={{color:C.primary,fontWeight:500}}>{part}</span>
                                : part
                            )}
                          </div>
                          {t.mentions.length > 0 && (
                            <div style={{display:'flex',gap:4,flexWrap:'wrap',marginTop:5}}>
                              {t.mentions.map(m => (
                                <span key={m.id} style={{display:'flex',alignItems:'center',gap:4,
                                  background:C.primaryLt,border:`1px solid ${C.primaryBd}`,
                                  borderRadius:12,padding:'2px 8px',fontSize:10,color:C.primary}}>
                                  <Avatar m={m} size="sm"/>
                                  {m.name.split(' ')[0]}
                                </span>
                              ))}
                            </div>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {/* Compose */}
                <div style={{borderTop:`1px solid ${C.border}`,paddingTop:12}} data-tag-area="1">
                  {/* Tagged chips */}
                  {taggedPeople.length > 0 && (
                    <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:8}}>
                      {taggedPeople.map(p => (
                        <span key={p.id} style={{display:'flex',alignItems:'center',gap:4,
                          background:C.primaryLt,border:`1px solid ${C.primaryBd}`,
                          borderRadius:12,padding:'3px 8px',fontSize:11,color:C.primary}}>
                          @{p.name.split(' ')[0]}
                          <button onClick={()=>untag(p.id)} style={{background:'none',border:'none',cursor:'pointer',color:C.t3,padding:0,lineHeight:1,fontSize:14}}>×</button>
                        </span>
                      ))}
                    </div>
                  )}

                  {/* Textarea with mention dropdown */}
                  <div style={{position:'relative'}}>
                    <textarea ref={threadRef} value={threadText} onChange={handleThreadChange} rows={2}
                      placeholder="Ask a follow-up or type @ to tag someone…"
                      style={{width:'100%',border:`1px solid ${C.border}`,borderRadius:6,
                        padding:'7px 10px',fontSize:12,resize:'none',outline:'none',
                        fontFamily:'Roboto,sans-serif',color:C.t1,background:'#fff'}}
                      onFocus={e=>e.target.style.borderColor=C.primary}
                      onBlur={e=>e.target.style.borderColor=C.border}
                      onKeyDown={e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitThread();} }}/>

                    {/* @ mention dropdown */}
                    {showTagPicker && (
                      <div style={{position:'absolute',bottom:'calc(100% + 4px)',left:0,right:0,
                        background:'#fff',border:`1px solid ${C.border}`,borderRadius:8,
                        boxShadow:'0 4px 16px rgba(0,0,0,0.12)',zIndex:200,overflow:'hidden'}}>
                        <div style={{padding:'6px 10px',fontSize:10,fontWeight:500,color:C.t3,
                          textTransform:'uppercase',letterSpacing:'0.6px',borderBottom:`1px solid ${C.border}`,background:C.bgAlt}}>
                          Question team
                        </div>
                        {QUESTION_POOL.filter(p=>p.name.toLowerCase().includes(mentionQuery)).map(p => (
                          <button key={p.id} onMouseDown={()=>tagPerson(p)}
                            style={{width:'100%',padding:'8px 12px',display:'flex',alignItems:'center',gap:9,
                              border:'none',background:'none',cursor:'pointer',textAlign:'left'}}
                            onMouseEnter={e=>e.currentTarget.style.background=C.bgAlt}
                            onMouseLeave={e=>e.currentTarget.style.background='none'}>
                            <Avatar m={p} size="sm"/>
                            <div>
                              <div style={{fontSize:12,fontWeight:500,color:C.t1}}>{p.name}</div>
                              <div style={{fontSize:11,color:C.t3}}>{p.company}</div>
                            </div>
                          </button>
                        ))}
                        {QUESTION_POOL.filter(p=>p.name.toLowerCase().includes(mentionQuery)).length===0 && (
                          <div style={{padding:'10px 12px',fontSize:12,color:C.t3}}>No matches</div>
                        )}
                      </div>
                    )}
                  </div>

                  {/* Actions row */}
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:8}}>
                    <button onClick={()=>{ setShowTagPicker(true); setMentionQuery(''); setThreadText(prev=>prev+'@'); threadRef.current?.focus(); }}
                      style={{display:'flex',alignItems:'center',gap:5,fontSize:12,color:C.t2,
                        background:'none',border:'none',cursor:'pointer',padding:'3px 0'}}
                      onMouseEnter={e=>e.currentTarget.style.color=C.t1}
                      onMouseLeave={e=>e.currentTarget.style.color=C.t2}>
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/></svg>
                      Tag someone
                    </button>
                    <button onClick={submitThread} disabled={!threadText.trim()}
                      style={{display:'flex',alignItems:'center',gap:5,padding:'5px 12px',
                        background:threadText.trim()?C.primary:'#c4c8f0',color:'#fff',
                        border:'none',borderRadius:5,fontSize:12,fontWeight:500,
                        cursor:threadText.trim()?'pointer':'default'}}
                      onMouseEnter={e=>{ if(threadText.trim()) e.currentTarget.style.background=C.primaryHov; }}
                      onMouseLeave={e=>{ if(threadText.trim()) e.currentTarget.style.background=C.primary; }}>
                      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg>
                      Send
                    </button>
                  </div>
                </div>
              </div>
            </>
          ) : isAdmin ? (
            <>
              {q.status==='pending' && (
                <button onClick={()=>onMarkIP(q.id)}
                  className="flex items-center gap-1.5 mb-3 text-xs font-medium hover:underline"
                  style={{color:C.primary}}>
                  <Ico.Flag size={12}/> Mark as In Progress
                </button>
              )}
              {/* ── AI suggested answer ── */}
              {aiLoading && (
                <div className="fade-in" style={{display:'flex',alignItems:'center',gap:8,padding:'10px 12px',background:'#fafbff',border:`1px solid ${C.primaryBd}`,borderRadius:8,marginBottom:12}}>
                  <div className="spin" style={{width:13,height:13,border:`2px solid ${C.primaryLt}`,borderTopColor:C.primary,borderRadius:'50%',flexShrink:0}}/>
                  <span style={{fontSize:12,color:C.primary}}>AI is reviewing available documents…</span>
                </div>
              )}
              {aiSuggestion && !aiDismissed && !aiLoading && (
                <div className="fade-in" style={{border:`1.5px solid ${C.primaryBd}`,borderRadius:8,overflow:'hidden',marginBottom:14}}>
                  {/* Card header */}
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 12px',background:C.primaryLt,borderBottom:`1px solid ${C.primaryBd}`}}>
                    <div style={{display:'flex',alignItems:'center',gap:6}}>
                      <svg width="13" height="13" viewBox="0 0 24 24" fill={C.primary}>
                        <path d="M12 2l1.09 3.26L16.5 4.5l-2.26 2.26L15.5 10l-3.5-2-3.5 2 1.26-3.24L7.5 4.5l3.41.74L12 2z"/>
                        <path d="M5 12l.72 2.16L8 15l-2.28.84L5 18l-.72-2.16L2 15l2.28-.84L5 12z" opacity=".6"/>
                      </svg>
                      <span style={{fontSize:11,fontWeight:600,color:C.primary}}>Suggested answer</span>
                      <span style={{fontSize:9,fontWeight:700,color:C.primary,background:'#fff',border:`1px solid ${C.primaryBd}`,borderRadius:8,padding:'1px 5px',letterSpacing:'0.3px'}}>AI</span>
                    </div>
                    <button onClick={()=>setAiDismissed(true)}
                      style={{background:'none',border:'none',cursor:'pointer',color:C.t3,display:'flex',padding:2,lineHeight:1}}
                      title="Dismiss suggestion">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                    </button>
                  </div>

                  {/* Suggested answer text */}
                  <div style={{padding:'10px 12px'}}>
                    <p style={{fontSize:12,color:C.t1,lineHeight:1.6,margin:'0 0 10px'}}>{aiSuggestion.answer}</p>

                    {/* Source */}
                    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:10}}>
                      {aiSuggestion.sourceType === 'vdr' ? (
                        <button
                          onClick={()=>onOpenDoc && onOpenDoc(aiSuggestion.source)}
                          title="Open in Documents tab"
                          style={{display:'inline-flex',alignItems:'center',gap:5,background:'#fff',border:`1px solid ${C.primaryBd}`,borderRadius:5,padding:'3px 8px',fontSize:11,color:C.t1,cursor:'pointer',transition:'background 0.1s'}}
                          onMouseEnter={e=>e.currentTarget.style.background=C.primaryLt}
                          onMouseLeave={e=>e.currentTarget.style.background='#fff'}>
                          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke={C.primary} strokeWidth="2" strokeLinecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                          <span style={{color:C.primary,fontWeight:500}}>VDR:</span>
                          <span>{aiSuggestion.source}</span>
                          <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke={C.t3} strokeWidth="2" strokeLinecap="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                        </button>
                      ) : (
                        <div style={{display:'inline-flex',alignItems:'center',gap:5,background:'#fff',border:`1px solid ${C.border}`,borderRadius:5,padding:'3px 8px',fontSize:11,color:C.t2}}>
                          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke={C.t3} strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                          {aiSuggestion.source}
                        </div>
                      )}
                    </div>

                    {/* Actions */}
                    <div style={{display:'flex',gap:7}}>
                      <button
                        onClick={()=>{ setAns(aiSuggestion.answer); setAiDismissed(true); }}
                        style={{flex:1,padding:'5px 0',background:C.primary,color:'#fff',border:'none',borderRadius:5,fontSize:12,fontWeight:500,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:5}}
                        onMouseEnter={e=>e.currentTarget.style.background=C.primaryHov}
                        onMouseLeave={e=>e.currentTarget.style.background=C.primary}>
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                        Use this answer
                      </button>
                      <button
                        onClick={()=>{ setAns(prev => prev ? prev + '\n\n' + aiSuggestion.answer : aiSuggestion.answer); setAiDismissed(true); }}
                        style={{padding:'5px 10px',background:'#fff',color:C.primary,border:`1px solid ${C.primaryBd}`,borderRadius:5,fontSize:12,fontWeight:500,cursor:'pointer'}}
                        onMouseEnter={e=>e.currentTarget.style.background=C.primaryLt}
                        onMouseLeave={e=>e.currentTarget.style.background='#fff'}
                        title="Append to your existing draft">
                        Insert
                      </button>
                    </div>
                  </div>
                </div>
              )}

              <div style={{fontSize:11,fontWeight:500,color:C.t3,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:8}}>Write Answer</div>
              <textarea value={ans} onChange={e=>setAns(e.target.value)} rows={4}
                placeholder="Type your response…"
                style={{width:'100%',border:`1px solid ${C.border}`,borderRadius:6,padding:'8px 10px',fontSize:13,resize:'none',outline:'none',fontFamily:'Roboto,sans-serif',color:C.t1,marginBottom:8}}
                onFocus={e=>e.target.style.borderColor=C.primary}
                onBlur={e=>e.target.style.borderColor=C.border}/>

              {/* ── Attachments ── */}
              {/* Chips for attached docs */}
              {attachments.length > 0 && (
                <div style={{display:'flex',flexWrap:'wrap',gap:5,marginBottom:8}}>
                  {attachments.map(a=>(
                    <div key={a.id} style={{display:'flex',alignItems:'center',gap:5,background:C.primaryLt,border:`1px solid ${C.primaryBd}`,borderRadius:5,padding:'3px 8px',fontSize:11}}>
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke={C.primary} strokeWidth="2" strokeLinecap="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                      <span style={{color:C.primary,fontWeight:500,maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.name}</span>
                      {a.placement && <span style={{color:C.t3,fontSize:10}}>→ {a.placement}</span>}
                      <button onClick={()=>setAttachments(prev=>prev.filter(x=>x.id!==a.id))}
                        style={{background:'none',border:'none',cursor:'pointer',color:C.t3,padding:0,display:'flex',lineHeight:1}}
                        onMouseEnter={e=>e.currentTarget.style.color='#dc2626'}
                        onMouseLeave={e=>e.currentTarget.style.color=C.t3}>
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                      </button>
                    </div>
                  ))}
                </div>
              )}

              {/* Attach action row */}
              {attachMode === null && (
                <div style={{display:'flex',gap:6,marginBottom:10}}>
                  <button onClick={()=>{ setAttachMode('existing'); setAttachSearch(''); }}
                    style={{display:'flex',alignItems:'center',gap:5,fontSize:11,color:C.t2,background:C.bgAlt,border:`1px solid ${C.border}`,borderRadius:5,padding:'4px 9px',cursor:'pointer'}}
                    onMouseEnter={e=>{e.currentTarget.style.borderColor=C.primary;e.currentTarget.style.color=C.primary;}}
                    onMouseLeave={e=>{e.currentTarget.style.borderColor=C.border;e.currentTarget.style.color=C.t2;}}>
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    Attach from VDR
                  </button>
                  <button onClick={()=>{ setAttachMode('upload'); setUploadName(''); setUploadFolder(VDR_FOLDERS[0]?.key||''); }}
                    style={{display:'flex',alignItems:'center',gap:5,fontSize:11,color:C.t2,background:C.bgAlt,border:`1px solid ${C.border}`,borderRadius:5,padding:'4px 9px',cursor:'pointer'}}
                    onMouseEnter={e=>{e.currentTarget.style.borderColor=C.primary;e.currentTarget.style.color=C.primary;}}
                    onMouseLeave={e=>{e.currentTarget.style.borderColor=C.border;e.currentTarget.style.color=C.t2;}}>
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    Upload new doc
                  </button>
                </div>
              )}

              {/* Attach from VDR picker */}
              {attachMode === 'existing' && (
                <div style={{border:`1px solid ${C.primaryBd}`,borderRadius:8,overflow:'hidden',marginBottom:10}}>
                  <div style={{padding:'8px 10px',background:C.primaryLt,borderBottom:`1px solid ${C.primaryBd}`,display:'flex',alignItems:'center',gap:7}}>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={C.primary} strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input autoFocus value={attachSearch} onChange={e=>setAttachSearch(e.target.value)}
                      placeholder="Search documents…"
                      style={{flex:1,border:'none',background:'transparent',fontSize:12,color:C.t1,outline:'none',fontFamily:'inherit'}}/>
                    <button onClick={()=>setAttachMode(null)} style={{background:'none',border:'none',cursor:'pointer',color:C.t3,display:'flex',padding:0}}>
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                    </button>
                  </div>
                  <div style={{maxHeight:160,overflowY:'auto'}}>
                    {ALL_VDR_DOCS
                      .filter(d=>!attachSearch || d.name.toLowerCase().includes(attachSearch.toLowerCase()))
                      .filter(d=>!attachments.find(a=>a.name===d.name))
                      .slice(0,12)
                      .map(doc=>(
                        <button key={doc.id} onClick={()=>{ setAttachments(prev=>[...prev,{id:Date.now(),name:doc.name,type:'existing'}]); setAttachMode(null); }}
                          style={{width:'100%',textAlign:'left',padding:'7px 10px',border:'none',borderBottom:`1px solid ${C.border}`,background:'none',cursor:'pointer',display:'flex',alignItems:'center',gap:8,fontSize:12,color:C.t1}}
                          onMouseEnter={e=>e.currentTarget.style.background=C.bgAlt}
                          onMouseLeave={e=>e.currentTarget.style.background='none'}>
                          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke={C.t3} strokeWidth="2" strokeLinecap="round" style={{flexShrink:0}}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                          <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{doc.name}</span>
                          <span style={{fontSize:10,color:C.t3,flexShrink:0}}>{doc.index}</span>
                        </button>
                      ))}
                    {ALL_VDR_DOCS.filter(d=>!attachSearch||d.name.toLowerCase().includes(attachSearch.toLowerCase())).length===0 && (
                      <div style={{padding:'12px 10px',fontSize:12,color:C.t3,textAlign:'center'}}>No documents match</div>
                    )}
                  </div>
                </div>
              )}

              {/* Upload new doc form */}
              {attachMode === 'upload' && (
                <div style={{border:`1px solid ${C.primaryBd}`,borderRadius:8,overflow:'hidden',marginBottom:10}}>
                  <div style={{padding:'8px 12px',background:C.primaryLt,borderBottom:`1px solid ${C.primaryBd}`,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                    <span style={{fontSize:12,fontWeight:600,color:C.primary}}>Upload new document</span>
                    <button onClick={()=>setAttachMode(null)} style={{background:'none',border:'none',cursor:'pointer',color:C.t3,display:'flex',padding:0}}>
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                    </button>
                  </div>
                  <div style={{padding:'10px 12px',display:'flex',flexDirection:'column',gap:10}}>
                    {/* File input simulation */}
                    <div style={{border:`2px dashed ${C.border}`,borderRadius:6,padding:'12px 10px',textAlign:'center',cursor:'pointer',background:C.bgAlt}}
                      onClick={()=>{ if(!uploadName) setUploadName('Document.pdf'); }}>
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={C.t3} strokeWidth="1.5" strokeLinecap="round" style={{margin:'0 auto 6px'}}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                      {uploadName
                        ? <p style={{fontSize:12,color:C.primary,margin:0,fontWeight:500}}>{uploadName}</p>
                        : <p style={{fontSize:11,color:C.t3,margin:0}}>Click to choose file</p>}
                    </div>
                    {/* File name override */}
                    <div>
                      <label style={{fontSize:10,fontWeight:500,color:C.t2,textTransform:'uppercase',letterSpacing:'0.4px',display:'block',marginBottom:3}}>File name</label>
                      <input value={uploadName} onChange={e=>setUploadName(e.target.value)}
                        placeholder="e.g. Financial Summary Q1 2026.pdf"
                        style={{width:'100%',border:`1px solid ${C.border}`,borderRadius:5,padding:'5px 8px',fontSize:12,color:C.t1,outline:'none',fontFamily:'inherit'}}
                        onFocus={e=>e.target.style.borderColor=C.primary}
                        onBlur={e=>e.target.style.borderColor=C.border}/>
                    </div>
                    {/* Placement in index */}
                    <div>
                      <label style={{fontSize:10,fontWeight:500,color:C.t2,textTransform:'uppercase',letterSpacing:'0.4px',display:'block',marginBottom:3}}>Place in index</label>
                      <select value={uploadFolder} onChange={e=>setUploadFolder(e.target.value)}
                        style={{width:'100%',border:`1px solid ${C.border}`,borderRadius:5,padding:'5px 8px',fontSize:12,color:C.t1,background:'#fff',outline:'none',cursor:'pointer'}}>
                        {VDR_FOLDERS.map(f=>(
                          <option key={f.key} value={f.key}>
                            {'\u00a0'.repeat(f.depth*2)}{f.num} {f.label}
                          </option>
                        ))}
                      </select>
                    </div>
                    <div style={{display:'flex',justifyContent:'flex-end',gap:7}}>
                      <button onClick={()=>setAttachMode(null)}
                        style={{padding:'4px 12px',border:`1px solid ${C.border}`,borderRadius:5,fontSize:12,color:C.t2,background:'#fff',cursor:'pointer'}}>
                        Cancel
                      </button>
                      <button disabled={!uploadName.trim()} onClick={()=>{
                          const folder = VDR_FOLDERS.find(f=>f.key===uploadFolder);
                          setAttachments(prev=>[...prev,{id:Date.now(),name:uploadName.trim(),type:'upload',placement:folder?`${folder.num} ${folder.label}`:''}]);
                          setAttachMode(null);
                        }}
                        style={{padding:'4px 12px',background:uploadName.trim()?C.primary:C.border,color:'#fff',border:'none',borderRadius:5,fontSize:12,fontWeight:500,cursor:uploadName.trim()?'pointer':'not-allowed'}}>
                        Attach
                      </button>
                    </div>
                  </div>
                </div>
              )}

              <Btn disabled={!ans.trim()||submitting} onClick={doAnswer} cls="w-full justify-center">
                <Ico.Send size={13}/>{submitting?'Sending…':'Send Answer'}
              </Btn>

              {/* Workflow CTA */}
              <div style={{marginTop:16,padding:'10px 12px',background:C.bgAlt,border:`1px solid ${C.border}`,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <Ico.Workflow size={13} cls="text-ds-t3"/>
                  <span style={{fontSize:12,color:C.t2}}>Need approvals before sending?</span>
                </div>
                <button onClick={()=>setShowWorkflow(true)}
                  style={{fontSize:12,color:C.primary,fontWeight:500,background:'none',border:'none',cursor:'pointer',textDecoration:'underline'}}>
                  Set up workflow
                </button>
              </div>
              {showWorkflow && (
                <WorkflowDialog initialCategory={q.category} onClose={()=>setShowWorkflow(false)}/>
              )}
            </>
          ) : (
            <div style={{textAlign:'center',padding:'24px 0'}}>
              <Ico.Clock size={24} cls="text-gray-200 mx-auto mb-2"/>
              <p style={{fontSize:12,color:C.t3,margin:0}}>Awaiting response from the answer team</p>
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

// ─── IRL Import ───────────────────────────────────────────────────────────────
const IRLImport = ({ onComplete, onCancel, existingQs=[] }) => {
  const [step, setStep] = useState('upload');
  const [filename, setFilename] = useState('');
  const [sel, setSel] = useState(new Set(SAMPLE_IRL.map((_,i)=>i)));
  const [drag, setDrag] = useState(false);
  // smart-check state
  const [flagged,      setFlagged]     = useState([]); // [{q, aiHit, similarQ}]
  const [flagStep,     setFlagStep]    = useState(0);  // current flagged question index
  // decisions[i]: 'skip' | 'ask' | undefined (undecided)
  const [decisions,    setDecisions]   = useState({});
  // editTexts[i]: possibly-edited question text
  const [editTexts,    setEditTexts]   = useState({});
  const [editingQ,     setEditingQ]    = useState(false);

  const go = () => { setFilename('Information_Request_List_v3.xlsx'); setStep('preview'); };
  const toggle = i => { const s=new Set(sel); s.has(i)?s.delete(i):s.add(i); setSel(s); };

  const runSmartCheck = () => {
    setStep('checking');
    setTimeout(()=>{
      const selected = SAMPLE_IRL.filter((_,i)=>sel.has(i));
      const hits = [];
      selected.forEach(q=>{
        const ai = genSuggestedAnswer(q);
        const sim = findSimilarQuestion(q.text, existingQs);
        if(ai||sim) hits.push({q, aiHit:ai, similarQ:sim});
      });
      if(hits.length===0){
        setStep('loading');
        setTimeout(()=>onComplete(selected),1000);
      } else {
        setFlagged(hits);
        setFlagStep(0);
        setDecisions({});
        setEditTexts({});
        setStep('smart');
      }
    }, 900);
  };

  const doFinalImport = (dec, edits) => {
    const selected = SAMPLE_IRL.filter((_,i)=>sel.has(i));
    // For flagged questions, apply decision + edits; for non-flagged, pass through
    const flaggedOrigTexts = new Set(flagged.map(f=>f.q.text));
    const toImport = selected
      .filter(q => {
        if(!flaggedOrigTexts.has(q.text)) return true; // non-flagged always in
        const fi = flagged.findIndex(f=>f.q.text===q.text);
        return dec[fi] !== 'skip';
      })
      .map(q => {
        const fi = flagged.findIndex(f=>f.q.text===q.text);
        if(fi>=0 && edits[fi] && edits[fi].trim()) return {...q, text:edits[fi].trim()};
        return q;
      });
    setStep('loading');
    setTimeout(()=>onComplete(toImport),1000);
  };

  const decideAndAdvance = (fi, choice) => {
    const newDec = {...decisions, [fi]:choice};
    const newEdits = editTexts;
    setDecisions(newDec);
    setEditingQ(false);
    if(fi < flagged.length - 1){
      setFlagStep(fi+1);
    } else {
      doFinalImport(newDec, newEdits);
    }
  };

  // Mark every undecided-or-decided flagged question as 'ask' and submit
  const askAllAnyway = () => {
    const newDec = {};
    flagged.forEach((_,i) => { newDec[i] = 'ask'; });
    setEditingQ(false);
    doFinalImport(newDec, editTexts);
  };

  if(step==='loading') return (
    <div className="flex-1 flex items-center justify-center">
      <div style={{textAlign:'center'}}>
        <div className="spin" style={{width:40,height:40,border:`3px solid ${C.primaryLt}`,borderTopColor:C.primary,borderRadius:'50%',margin:'0 auto 12px'}}/>
        <p style={{fontSize:13,color:C.t2}}>Importing questions…</p>
      </div>
    </div>
  );

  if(step==='checking') return (
    <div className="flex-1 flex items-center justify-center">
      <div style={{textAlign:'center'}}>
        <div className="spin" style={{width:40,height:40,border:`3px solid ${C.primaryLt}`,borderTopColor:C.primary,borderRadius:'50%',margin:'0 auto 12px'}}/>
        <p style={{fontSize:13,color:C.t2}}>AI is reviewing your questions…</p>
        <p style={{fontSize:12,color:C.t3,marginTop:4}}>Checking for existing answers and duplicates</p>
      </div>
    </div>
  );

  if(step==='smart') {
    const fi      = flagStep;
    const total   = flagged.length;
    const current = flagged[fi];
    const { q, aiHit, similarQ } = current;
    const curText = editTexts[fi] !== undefined ? editTexts[fi] : q.text;
    const decided = decisions[fi];
    const nonFlagged = sel.size - total;

    return (
      <div className="flex-1 flex flex-col overflow-hidden">
        {/* Header */}
        <div className="flex items-center justify-between px-6 py-4 flex-shrink-0" style={{borderBottom:`1px solid ${C.border}`}}>
          <div className="flex items-center gap-3">
            <button onClick={()=>{ if(fi>0){setFlagStep(fi-1);setEditingQ(false);}else{setStep('preview');} }}
              style={{color:C.t2}} className="hover:text-gray-900"><Ico.ArrowL size={18}/></button>
            <div>
              <h2 style={{fontSize:15,fontWeight:600,color:C.t1,margin:0}}>Review flagged question {fi+1} of {total}</h2>
              <p style={{fontSize:12,color:C.t2,margin:'2px 0 0'}}>
                AI found a potential answer or duplicate — decide before submitting
              </p>
            </div>
          </div>
          {/* Step dots */}
          <div style={{display:'flex',gap:5,alignItems:'center'}}>
            {flagged.map((_,i)=>(
              <button key={i} onClick={()=>{setFlagStep(i);setEditingQ(false);}}
                style={{width:decisions[i]==='skip'?8:decisions[i]==='ask'?8:8,height:8,borderRadius:'50%',border:'none',cursor:'pointer',padding:0,
                  background:i===fi?C.primary:decisions[i]==='skip'?'#e5e7eb':decisions[i]==='ask'?'#059669':'#d1d5db',
                  transition:'background 0.2s'}}/>
            ))}
          </div>
        </div>

        {/* Content */}
        <div className="flex-1 overflow-y-auto" style={{padding:'20px 24px',maxWidth:560,width:'100%',margin:'0 auto'}}>

          {/* Your question — editable */}
          <div style={{marginBottom:16}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
              <span style={{fontSize:11,fontWeight:600,color:C.t3,textTransform:'uppercase',letterSpacing:'0.05em'}}>Your question</span>
              {!editingQ && (
                <button onClick={()=>setEditingQ(true)}
                  style={{display:'flex',alignItems:'center',gap:4,fontSize:11,color:C.primary,fontWeight:500,background:'none',border:'none',cursor:'pointer',padding:0}}
                  onMouseEnter={e=>e.currentTarget.style.textDecoration='underline'}
                  onMouseLeave={e=>e.currentTarget.style.textDecoration='none'}>
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                  Edit
                </button>
              )}
            </div>
            {editingQ ? (
              <textarea
                autoFocus
                value={curText}
                onChange={e=>setEditTexts(prev=>({...prev,[fi]:e.target.value}))}
                onBlur={()=>setEditingQ(false)}
                rows={3}
                style={{width:'100%',border:`2px solid ${C.primary}`,borderRadius:8,padding:'10px 12px',fontSize:13,color:C.t1,resize:'none',outline:'none',fontFamily:'Roboto,sans-serif',lineHeight:1.5,
                  boxShadow:`0 0 0 3px ${C.primaryLt}`,transition:'box-shadow 0.15s'}}/>
            ) : (
              <div style={{background:C.bgAlt,border:`1px solid ${C.border}`,borderRadius:8,padding:'10px 14px',cursor:'text'}}
                onClick={()=>setEditingQ(true)}>
                <p style={{fontSize:13,color:C.t1,margin:0,lineHeight:1.5}}>
                  {curText !== q.text && <span style={{fontSize:10,fontWeight:600,color:C.primary,background:C.primaryLt,padding:'1px 6px',borderRadius:10,marginRight:6}}>Edited</span>}
                  {curText}
                </p>
              </div>
            )}
            <div style={{display:'flex',gap:6,marginTop:6}}>
              <CatTag cat={q.category}/><Pip p={q.priority}/>
            </div>
          </div>

          {/* AI / duplicate info */}
          {aiHit && (
            <div style={{border:`1px solid ${C.primaryBd}`,borderRadius:10,overflow:'hidden',marginBottom:12}}>
              <div style={{background:'linear-gradient(135deg,#485ef0 0%,#6d7ef5 100%)',padding:'10px 14px',display:'flex',alignItems:'center',gap:8}}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                <span style={{fontSize:12,fontWeight:600,color:'#fff',flex:1}}>AI can answer this</span>
                <span style={{fontSize:10,fontWeight:700,background:'rgba(255,255,255,0.25)',color:'#fff',padding:'2px 7px',borderRadius:10,letterSpacing:'0.04em'}}>AI</span>
              </div>
              <div style={{padding:'12px 14px'}}>
                <p style={{fontSize:12,color:C.t1,lineHeight:1.6,margin:'0 0 10px'}}>{aiHit.answer}</p>
                {aiHit.sourceType==='vdr' ? (
                  <div style={{display:'inline-flex',alignItems:'center',gap:5,background:'#f0f4ff',border:`1px solid ${C.primaryBd}`,borderRadius:5,padding:'3px 8px',fontSize:11,color:C.t1}}>
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke={C.primary} strokeWidth="2" strokeLinecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    <span style={{color:C.primary,fontWeight:500}}>VDR:</span><span>{aiHit.source}</span>
                  </div>
                ) : (
                  <div style={{display:'inline-flex',alignItems:'center',gap:5,background:'#f9fafb',border:`1px solid ${C.border}`,borderRadius:5,padding:'3px 8px',fontSize:11,color:C.t2}}>
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke={C.t3} strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                    {aiHit.source}
                  </div>
                )}
              </div>
            </div>
          )}

          {similarQ && (
            <div style={{border:`1px solid #fde68a`,borderRadius:10,overflow:'hidden',marginBottom:12}}>
              <div style={{background:'#fffbeb',padding:'10px 14px',display:'flex',alignItems:'center',gap:8,borderBottom:`1px solid #fde68a`}}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#b45309" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span style={{fontSize:12,fontWeight:600,color:'#92400e',flex:1}}>Similar question already submitted</span>
                <span style={{fontSize:10,fontWeight:600,background:'#fef3c7',color:'#b45309',padding:'2px 7px',borderRadius:10}}>#{similarQ.number}</span>
              </div>
              <div style={{padding:'12px 14px'}}>
                <p style={{fontSize:12,color:C.t1,lineHeight:1.5,margin:'0 0 6px',fontStyle:'italic'}}>"{similarQ.text}"</p>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:11,color:C.t2}}>Status:</span>
                  <span style={{fontSize:11,fontWeight:500,color:similarQ.status==='answered'?'#059669':similarQ.status==='in-progress'?C.primary:'#6b7280',textTransform:'capitalize'}}>
                    {similarQ.status==='in-progress'?'In progress':similarQ.status}
                  </span>
                  {similarQ.status==='answered'&&<span style={{fontSize:11,color:C.t2}}>· Answer available</span>}
                </div>
              </div>
            </div>
          )}

          {/* Decision buttons */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginTop:4}}>
            <button onClick={()=>decideAndAdvance(fi,'skip')}
              style={{padding:'12px 0',border:`2px solid ${decided==='skip'?'#dc2626':'#e5e7eb'}`,borderRadius:8,background:decided==='skip'?'#fef2f2':'#fff',
                color:decided==='skip'?'#dc2626':C.t2,fontSize:13,fontWeight:500,cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:4,transition:'all 0.15s'}}
              onMouseEnter={e=>{if(decided!=='skip'){e.currentTarget.style.borderColor='#dc2626';e.currentTarget.style.color='#dc2626';}}}
              onMouseLeave={e=>{if(decided!=='skip'){e.currentTarget.style.borderColor='#e5e7eb';e.currentTarget.style.color=C.t2;}}}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
              Don't ask this
              <span style={{fontSize:10,color:'inherit',opacity:0.7,fontWeight:400}}>Got the answer</span>
            </button>
            <button onClick={()=>decideAndAdvance(fi,'ask')}
              style={{padding:'12px 0',border:`2px solid ${decided==='ask'?C.primary:C.primaryBd}`,borderRadius:8,background:decided==='ask'?C.primaryLt:'#fff',
                color:decided==='ask'?C.primary:C.t1,fontSize:13,fontWeight:500,cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:4,transition:'all 0.15s'}}
              onMouseEnter={e=>{if(decided!=='ask'){e.currentTarget.style.background=C.primaryLt;}}}
              onMouseLeave={e=>{if(decided!=='ask'){e.currentTarget.style.background='#fff';}}}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              {fi < total-1 ? 'Ask anyway' : 'Ask anyway & submit'}
              <span style={{fontSize:10,color:'inherit',opacity:0.7,fontWeight:400}}>Send to sell side</span>
            </button>
          </div>
          {/* Ask all anyway — only shown when there are still unreviewed questions ahead */}
          {fi < total-1 && (
            <div style={{textAlign:'center',marginTop:10}}>
              <button onClick={askAllAnyway}
                style={{fontSize:11,color:C.t3,background:'none',border:'none',cursor:'pointer',textDecoration:'underline',padding:'2px 0'}}
                onMouseEnter={e=>e.currentTarget.style.color=C.t2}
                onMouseLeave={e=>e.currentTarget.style.color=C.t3}>
                Ask all remaining anyway and submit
              </button>
            </div>
          )}

          {/* Non-flagged pass-through note */}
          {nonFlagged > 0 && fi === total-1 && (
            <div style={{marginTop:16,padding:'10px 14px',background:C.bgAlt,border:`1px solid ${C.border}`,borderRadius:8,display:'flex',alignItems:'center',gap:8}}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#059669" strokeWidth="2.5" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>
              <p style={{fontSize:12,color:C.t2,margin:0}}>
                <span style={{fontWeight:500,color:C.t1}}>{nonFlagged} other question{nonFlagged!==1?'s':''}</span> had no issues and will be included automatically.
              </p>
            </div>
          )}
        </div>
      </div>
    );
  }

  if(step==='upload') return (
    <div className="flex-1 flex items-center justify-center p-12">
      <div style={{width:'100%',maxWidth:420}}>
        <div className="flex items-center gap-3 mb-6">
          <button onClick={onCancel} style={{color:C.t2}} className="hover:text-gray-900"><Ico.ArrowL size={18}/></button>
          <div>
            <h2 style={{fontSize:15,fontWeight:600,color:C.t1,margin:0}}>Upload Request List</h2>
            <p style={{fontSize:12,color:C.t2,margin:'2px 0 0'}}>Import your IRL or DRL from Excel or CSV</p>
          </div>
        </div>
        <div onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)}
          onDrop={e=>{e.preventDefault();setDrag(false);go();}} onClick={go}
          style={{border:`2px dashed ${drag?C.primary:C.border}`,borderRadius:12,padding:'48px 24px',textAlign:'center',cursor:'pointer',background:drag?C.primaryLt:'transparent',transition:'all 0.15s'}}>
          <Ico.Upload size={36} cls="text-gray-300 mx-auto mb-3"/>
          <p style={{fontSize:13,fontWeight:500,color:C.t1,marginBottom:4}}>Drop your file here, or click to browse</p>
          <p style={{fontSize:12,color:C.t2}}>Supports .xlsx, .xls, and .csv</p>
        </div>
        <p style={{textAlign:'center',marginTop:12}}>
          <button onClick={go} style={{fontSize:12,color:C.primary,fontWeight:500,textDecoration:'underline'}}>Use sample IRL instead →</button>
        </p>
      </div>
    </div>
  );

  const allChk = sel.size===SAMPLE_IRL.length;
  return (
    <div className="flex-1 flex flex-col overflow-hidden">
      <div className="flex items-center justify-between px-6 py-4 flex-shrink-0" style={{borderBottom:`1px solid ${C.border}`}}>
        <div className="flex items-center gap-3">
          <button onClick={onCancel} style={{color:C.t2}} className="hover:text-gray-900"><Ico.ArrowL size={18}/></button>
          <div>
            <h2 style={{fontSize:15,fontWeight:600,color:C.t1,margin:0}}>Review Before Importing</h2>
            <p style={{fontSize:12,color:C.t2,margin:'2px 0 0'}}>{filename||'Sample IRL'} · {sel.size} of {SAMPLE_IRL.length} selected</p>
          </div>
        </div>
        <Btn disabled={sel.size===0} onClick={runSmartCheck}>Continue <Ico.ChevR size={13}/></Btn>
      </div>
      <div className="flex-1 overflow-y-auto">
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
          <thead style={{position:'sticky',top:0}}>
            <tr style={{borderBottom:`1px solid ${C.border}`,background:C.bgAlt}}>
              <th style={{width:40,padding:'8px 14px',textAlign:'center'}}>
                <input type="checkbox" checked={allChk} onChange={e=>setSel(e.target.checked?new Set(SAMPLE_IRL.map((_,i)=>i)):new Set())}/>
              </th>
              {['ID','Request','Category','Priority'].map(h=>(
                <th key={h} style={{textAlign:'left',padding:'8px 10px',fontSize:11,fontWeight:500,color:C.t2,textTransform:'uppercase',letterSpacing:'0.05em'}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {SAMPLE_IRL.map((q,i)=>(
              <tr key={i} onClick={()=>toggle(i)} style={{borderBottom:`1px solid ${C.border}`,cursor:'pointer',opacity:sel.has(i)?1:0.4,transition:'opacity 0.1s'}}
                className="hover:bg-gray-50">
                <td style={{padding:'10px 14px',textAlign:'center'}}><input type="checkbox" checked={sel.has(i)} onChange={()=>toggle(i)} onClick={e=>e.stopPropagation()}/></td>
                <td style={{padding:'10px',fontFamily:'monospace',fontSize:11,color:C.t2}}>{q.number}</td>
                <td style={{padding:'10px',color:C.t1}}>{q.text}</td>
                <td style={{padding:'10px'}}><CatTag cat={q.category}/></td>
                <td style={{padding:'10px'}}><div className="flex items-center gap-1.5"><Pip p={q.priority}/><span style={{fontSize:11,color:C.t2,textTransform:'capitalize'}}>{q.priority}</span></div></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
};

// ─── Admin Empty State ────────────────────────────────────────────────────────
// ─── FAQ components ───────────────────────────────────────────────────────────
const CAT_STYLE = {
  Finance:{ bg:'#eff6ff', color:'#1d4ed8' },
  HR:     { bg:'#f5f3ff', color:'#7c3aed' },
  Legal:  { bg:'#fff1f2', color:'#9f1239' },
  Tax:    { bg:'#fffbeb', color:'#b45309' },
  General:{ bg:'#f9fafb', color:'#374151' },
  IT:     { bg:'#f0f9ff', color:'#0369a1' },
};

const FaqCard = ({ faq, index, isAdmin, onEdit, onDelete, onToggle }) => {
  const [expanded, setExpanded] = useState(false);
  const [hov, setHov] = useState(false);
  const cat = CAT_STYLE[faq.category] || CAT_STYLE.General;

// ─── FAQ Import Flow ──────────────────────────────────────────────────────────
const FaqImport = ({ onComplete, onCancel, nextId }) => {
  const [step,     setStep]     = useState('upload');   // 'upload' | 'preview' | 'loading'
  const [filename, setFilename] = useState('');
  const [drag,     setDrag]     = useState(false);
  // Each row carries its own editable category + publish flag + selected state
  const [rows, setRows] = useState(
    SAMPLE_FAQ_IMPORT.map((f,i)=>({...f, _idx:i, published:true, selected:true}))
  );

  const accept = '.xlsx,.xls,.docx,.doc,.pdf';
  const formatLabel = 'Excel, Word, or PDF';

  const go = (name='') => {
    setFilename(name || 'FAQ_List.xlsx');
    setStep('preview');
  };

  const toggle    = i   => setRows(r=>r.map(row=>row._idx===i?{...row,selected:!row.selected}:row));
  const toggleAll = chk => setRows(r=>r.map(row=>({...row,selected:chk})));
  const setRowCat = (i,cat) => setRows(r=>r.map(row=>row._idx===i?{...row,category:cat}:row));
  const setRowPub = (i,pub) => setRows(r=>r.map(row=>row._idx===i?{...row,published:pub}:row));

  const sel   = rows.filter(r=>r.selected);
  const allChk = sel.length === rows.length;

  const doImport = () => {
    setStep('loading');
    setTimeout(()=>{
      onComplete(sel.map((r,i)=>({
        id:     nextId + i,
        question:   r.question,
        answer:     r.answer,
        category:   r.category,
        published:  r.published,
      })));
    }, 1100);
  };

  if(step==='loading') return (
    <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{textAlign:'center'}}>
        <div className="spin" style={{width:40,height:40,border:`3px solid ${C.primaryLt}`,borderTopColor:C.primary,borderRadius:'50%',margin:'0 auto 12px'}}/>
        <p style={{fontSize:13,color:C.t2}}>Importing {sel.length} FAQ{sel.length!==1?'s':''}…</p>
      </div>
    </div>
  );

  if(step==='upload') return (
    <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',padding:48}}>
      <div style={{width:'100%',maxWidth:440}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:24}}>
          <button onClick={onCancel} style={{color:C.t2,background:'none',border:'none',cursor:'pointer',display:'flex',padding:2}}
            className="hover:text-gray-900"><Ico.ArrowL size={18}/></button>
          <div>
            <h2 style={{fontSize:15,fontWeight:600,color:C.t1,margin:0}}>Import FAQ List</h2>
            <p style={{fontSize:12,color:C.t2,margin:'2px 0 0'}}>Bulk-upload questions and answers from a file</p>
          </div>
        </div>

        {/* Drop zone */}
        <div
          onDragOver={e=>{e.preventDefault();setDrag(true);}}
          onDragLeave={()=>setDrag(false)}
          onDrop={e=>{e.preventDefault();setDrag(false);const f=e.dataTransfer.files[0];if(f)go(f.name);}}
          onClick={()=>go()}
          style={{border:`2px dashed ${drag?C.primary:C.border}`,borderRadius:12,padding:'44px 24px',textAlign:'center',cursor:'pointer',background:drag?C.primaryLt:'transparent',transition:'all 0.15s'}}>
          {/* File type icons */}
          <div style={{display:'flex',justifyContent:'center',gap:10,marginBottom:14}}>
            {[
              {label:'XLSX', bg:'#d1fae5', color:'#065f46'},
              {label:'DOCX', bg:'#dbeafe', color:'#1e40af'},
              {label:'PDF',  bg:'#fee2e2', color:'#991b1b'},
            ].map(({label,bg,color})=>(
              <div key={label} style={{width:38,height:44,borderRadius:6,background:bg,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:2}}>
                <span style={{fontSize:8,fontWeight:700,color,letterSpacing:'0.3px'}}>{label}</span>
              </div>
            ))}
          </div>
          <p style={{fontSize:13,fontWeight:500,color:C.t1,marginBottom:4}}>Drop your file here, or click to browse</p>
          <p style={{fontSize:12,color:C.t2}}>Supports {formatLabel}</p>
        </div>

        {/* Template hint */}
        <div style={{display:'flex',alignItems:'flex-start',gap:8,background:C.bgAlt,border:`1px solid ${C.border}`,borderRadius:8,padding:'9px 12px',marginTop:12}}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={C.t3} strokeWidth="2" strokeLinecap="round" style={{flexShrink:0,marginTop:1}}>
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <p style={{fontSize:12,color:C.t2,margin:0,lineHeight:1.5}}>
            Your file should have a <strong>Question</strong> column and an <strong>Answer</strong> column. An optional <strong>Category</strong> column is also supported.
          </p>
        </div>

        <p style={{textAlign:'center',marginTop:12}}>
          <button onClick={()=>go('FAQ_Sample.xlsx')} style={{fontSize:12,color:C.primary,fontWeight:500,textDecoration:'underline',background:'none',border:'none',cursor:'pointer'}}>
            Use sample FAQ list instead →
          </button>
        </p>
      </div>
    </div>
  );

  // Preview step
  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      {/* Preview header */}
      <div style={{padding:'12px 24px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <button onClick={onCancel} style={{color:C.t2,background:'none',border:'none',cursor:'pointer',display:'flex',padding:2}}
            className="hover:text-gray-900"><Ico.ArrowL size={18}/></button>
          <div>
            <h2 style={{fontSize:14,fontWeight:600,color:C.t1,margin:0}}>Review Before Importing</h2>
            <p style={{fontSize:12,color:C.t2,margin:'1px 0 0'}}>{filename} · {sel.length} of {rows.length} selected</p>
          </div>
        </div>
        <Btn disabled={sel.length===0} onClick={doImport}>
          Import {sel.length} FAQ{sel.length!==1?'s':''}
        </Btn>
      </div>

      {/* Table */}
      <div style={{flex:1,overflowY:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
          <thead style={{position:'sticky',top:0,zIndex:1}}>
            <tr style={{borderBottom:`1px solid ${C.border}`,background:C.bgAlt}}>
              <th style={{width:40,padding:'8px 14px',textAlign:'center'}}>
                <input type="checkbox" checked={allChk} onChange={e=>toggleAll(e.target.checked)}/>
              </th>
              {['Question','Answer','Category','Publish'].map(h=>(
                <th key={h} style={{textAlign:'left',padding:'8px 10px',fontSize:11,fontWeight:500,color:C.t2,textTransform:'uppercase',letterSpacing:'0.05em',whiteSpace:'nowrap'}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map(row=>(
              <tr key={row._idx}
                style={{borderBottom:`1px solid ${C.border}`,opacity:row.selected?1:0.38,transition:'opacity 0.1s',cursor:'pointer',background:'#fff'}}
                className="hover:bg-gray-50"
                onClick={()=>toggle(row._idx)}>
                <td style={{padding:'10px 14px',textAlign:'center'}} onClick={e=>e.stopPropagation()}>
                  <input type="checkbox" checked={row.selected} onChange={()=>toggle(row._idx)}/>
                </td>
                <td style={{padding:'10px',color:C.t1,maxWidth:220}}>
                  <div style={{overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',fontSize:12,lineHeight:1.45}}>
                    {row.question}
                  </div>
                </td>
                <td style={{padding:'10px',color:C.t2,maxWidth:260}}>
                  <div style={{overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',fontSize:12,lineHeight:1.45}}>
                    {row.answer}
                  </div>
                </td>
                <td style={{padding:'10px'}} onClick={e=>e.stopPropagation()}>
                  <select value={row.category} onChange={e=>setRowCat(row._idx,e.target.value)}
                    style={{border:`1px solid ${C.border}`,borderRadius:5,padding:'3px 6px',fontSize:12,color:C.t1,background:'#fff',outline:'none',cursor:'pointer'}}>
                    {CATEGORIES.map(c=><option key={c}>{c}</option>)}
                  </select>
                </td>
                <td style={{padding:'10px'}} onClick={e=>e.stopPropagation()}>
                  <div style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer'}} onClick={()=>setRowPub(row._idx,!row.published)}>
                    <div style={{width:28,height:16,borderRadius:8,background:row.published?C.primary:'#d1d5db',transition:'background 0.15s',position:'relative',flexShrink:0}}>
                      <div style={{position:'absolute',top:2,left:row.published?12:2,width:12,height:12,borderRadius:'50%',background:'#fff',transition:'left 0.15s'}}/>
                    </div>
                    <span style={{fontSize:11,color:row.published?C.primary:C.t3,whiteSpace:'nowrap'}}>{row.published?'Live':'Draft'}</span>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
};

const FaqAiSuggestions = ({ onComplete, onCancel, nextId }) => {
  const { useEffect: useEffectAI } = React;
  const [step,       setStep]      = useState('intro');    // 'intro' | 'generating' | 'preview'
  const [phase,      setPhase]     = useState(0);          // which status message is active
  const [rows,       setRows]      = useState([]);

  const GEN_PHASES = [
    'Scanning financial documents…',
    'Reviewing legal and HR sections…',
    'Analyzing IP and IT disclosures…',
    'Identifying likely buyer questions…',
    'Drafting answers from source documents…',
    'Finalizing suggestions…',
  ];

  const startGenerating = () => {
    setStep('generating');
    setPhase(0);
  };

  useEffectAI(()=>{
    if(step !== 'generating') return;
    if(phase < GEN_PHASES.length - 1) {
      const t = setTimeout(()=>setPhase(p=>p+1), 700);
      return ()=>clearTimeout(t);
    } else {
      const t = setTimeout(()=>{
        setRows(SAMPLE_AI_FAQS.map((f,i)=>({...f, _idx:i, published:true, selected:true})));
        setStep('preview');
      }, 800);
      return ()=>clearTimeout(t);
    }
  }, [step, phase]);

  const toggle    = i   => setRows(r=>r.map(row=>row._idx===i?{...row,selected:!row.selected}:row));
  const toggleAll = chk => setRows(r=>r.map(row=>({...row,selected:chk})));
  const setRowCat = (i,cat) => setRows(r=>r.map(row=>row._idx===i?{...row,category:cat}:row));
  const setRowPub = (i,pub) => setRows(r=>r.map(row=>row._idx===i?{...row,published:pub}:row));

  const sel    = rows.filter(r=>r.selected);
  const allChk = sel.length === rows.length && rows.length > 0;

  const doAdd = () => {
    onComplete(sel.map((r,i)=>({
      id:       nextId + i,
      question: r.question,
      answer:   r.answer,
      category: r.category,
      published:r.published,

          <Ico.ArrowL size={16}/> Back to FAQ
        </button>

        {/* Hero icon */}
        <div style={{width:52,height:52,borderRadius:14,background:'linear-gradient(135deg,#485ef0 0%,#7c6fff 100%)',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:18,boxShadow:'0 4px 16px rgba(72,94,240,0.28)'}}>

            <path d="M5 12l.72 2.16L8 15l-2.28.84L5 18l-.72-2.16L2 15l2.28-.84L5 12z" opacity=".75"/>
            <path d="M19 12l.48 1.44L21 14l-1.52.56L19 16l-.48-1.44L17 14l1.52-.56L19 12z" opacity=".6"/>
          </svg>

                    : null}
                </div>
                <span style={{fontSize:12,color:done?'#059669':active?C.primary:C.t3,fontWeight:active?500:400}}>{msg}</span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );

  // ── Preview / review screen ──
  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      {/* Header */}
      <div style={{padding:'12px 24px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0,background:'#fff'}}>

          <div>
            <div style={{display:'flex',alignItems:'center',gap:7}}>
              <h2 style={{fontSize:14,fontWeight:600,color:C.t1,margin:0}}>AI-suggested FAQs</h2>
              <span style={{fontSize:10,fontWeight:600,color:C.primary,background:C.primaryLt,border:`1px solid ${C.primaryBd}`,borderRadius:10,padding:'1px 7px',letterSpacing:'0.3px'}}>AI</span>
            </div>
            <p style={{fontSize:12,color:C.t2,margin:'1px 0 0'}}>{sel.length} of {rows.length} selected · review and edit before adding</p>
          </div>
        </div>
        <Btn disabled={sel.length===0} onClick={doAdd}>
          Add {sel.length} FAQ{sel.length!==1?'s':''} to list
        </Btn>
      </div>

      {/* Table */}
      <div style={{flex:1,overflowY:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>

                <th key={h} style={{textAlign:'left',padding:'8px 10px',fontSize:11,fontWeight:500,color:C.t2,textTransform:'uppercase',letterSpacing:'0.05em',whiteSpace:'nowrap'}}>{h}</th>

                    <span style={{fontSize:10,color:C.t3,fontStyle:'italic'}}>{row.source}</span>

                <td style={{padding:'10px',maxWidth:260}}>

                </td>
                {/* Confidence */}
                <td style={{padding:'10px',textAlign:'center'}}>
                  <span style={{
                    fontSize:10,fontWeight:600,borderRadius:10,padding:'2px 8px',
                    background: row.confidence==='high'?'#d1fae5':'#fffbeb',
                    color:      row.confidence==='high'?'#065f46':'#92400e',
                    border:     `1px solid ${row.confidence==='high'?'#6ee7b7':'#fde68a'}`,
                    whiteSpace:'nowrap',
                  }}>
                    {row.confidence==='high'?'High':'Medium'}
                  </span>
                </td>
                {/* Publish toggle */}
                <td style={{padding:'10px'}} onClick={e=>e.stopPropagation()}>
                  <div style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer'}} onClick={()=>setRowPub(row._idx,!row.published)}>

                      <div style={{position:'absolute',top:2,left:row.published?12:2,width:12,height:12,borderRadius:'50%',background:'#fff',transition:'left 0.15s'}}/>
                    </div>
                    <span style={{fontSize:11,color:row.published?C.primary:C.t3,whiteSpace:'nowrap'}}>{row.published?'Live':'Draft'}</span>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
};

const FaqPanel = ({ faqs, setFaqs, isAdmin }) => {
  const [showForm,      setShowForm]      = useState(false);
  const [showImport,    setShowImport]    = useState(false);
  const [showAiSuggest, setShowAiSuggest] = useState(false);
  const [editItem,      setEditItem]      = useState(null);
  const [form, setForm] = useState({question:'',answer:'',category:'General',published:true});

  const visible = isAdmin ? faqs : faqs.filter(f=>f.published);
  const newId = () => Math.max(0, ...faqs.map(f=>f.id)) + 1;

  const closeAll  = () => { setShowImport(false); setShowAiSuggest(false); setShowForm(false); };
  const openAdd  = () => { setForm({question:'',answer:'',category:'General',published:true}); setEditItem(null); closeAll(); setShowForm(true); };
  const openEdit = faq => { setForm({question:faq.question,answer:faq.answer,category:faq.category,published:faq.published}); setEditItem(faq); setShowForm(true); };
  const cancel   = () => setShowForm(false);
  const save = () => {
    if(!form.question.trim()||!form.answer.trim()) return;
    if(editItem) setFaqs(prev=>prev.map(f=>f.id===editItem.id?{...f,...form}:f));
    else setFaqs(prev=>[...prev,{id:newId(),...form}]);
    setShowForm(false);
  };
  const remove = id => { setFaqs(prev=>prev.filter(f=>f.id!==id)); };
  const toggle = id => setFaqs(prev=>prev.map(f=>f.id===id?{...f,published:!f.published}:f));
  const canSave = form.question.trim() && form.answer.trim();

  const importComplete = imported => { setFaqs(prev=>[...prev,...imported]); setShowImport(false); };
  const aiComplete    = imported => { setFaqs(prev=>[...prev,...imported]); setShowAiSuggest(false); };

  if(showImport) return (
    <FaqImport onCancel={()=>setShowImport(false)} onComplete={importComplete} nextId={newId()}/>
  );

  if(showAiSuggest) return (
    <FaqAiSuggestions onCancel={()=>setShowAiSuggest(false)} onComplete={aiComplete} nextId={newId()}/>
  );

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      {/* Header */}
      <div style={{padding:'10px 24px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:13,fontWeight:500,color:C.t1}}>Frequently Asked Questions</span>
          <span style={{fontSize:12,color:C.t3}}>
            {isAdmin ? `${faqs.length} total · ${faqs.filter(f=>f.published).length} published` : `${visible.length} published`}

        </div>
        {isAdmin && (
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            {/* AI Suggestions button */}
            <button onClick={()=>{closeAll();setShowAiSuggest(true);}}
              style={{display:'flex',alignItems:'center',gap:6,padding:'5px 11px',background:'#fff',color:C.primary,border:`1px solid ${C.primaryBd}`,borderRadius:6,fontSize:12,fontWeight:500,cursor:'pointer'}}
              onMouseEnter={e=>{e.currentTarget.style.background=C.primaryLt;}}
              onMouseLeave={e=>{e.currentTarget.style.background='#fff';}}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill={C.primary}>
                <path d="M12 2l1.09 3.26L16.5 4.5l-2.26 2.26L15.5 10l-3.5-2-3.5 2 1.26-3.24L7.5 4.5l3.41.74L12 2z"/>
                <path d="M5 12l.72 2.16L8 15l-2.28.84L5 18l-.72-2.16L2 15l2.28-.84L5 12z" opacity=".8"/>
              </svg>
              AI Suggestions

            {/* Import button */}

              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>

              Import

              <div>
                <label style={{fontSize:11,fontWeight:500,color:C.t2,display:'block',marginBottom:4}}>Category</label>
                <select value={form.category} onChange={e=>setForm(p=>({...p,category:e.target.value}))}
                  style={{padding:'5px 28px 5px 8px',border:`1px solid ${C.border}`,borderRadius:6,fontSize:13,color:C.t1,background:'#fff',cursor:'pointer',outline:'none'}}>
                  {CATEGORIES.map(c=><option key={c}>{c}</option>)}
                </select>
              </div>
              {/* Published toggle */}
              <div style={{display:'flex',alignItems:'center',gap:7,cursor:'pointer',marginTop:16}} onClick={()=>setForm(p=>({...p,published:!p.published}))}>
                <div style={{width:32,height:18,borderRadius:9,background:form.published?C.primary:'#d1d5db',transition:'background 0.2s',position:'relative',flexShrink:0}}>
                  <div style={{position:'absolute',top:2,left:form.published?14:2,width:14,height:14,borderRadius:'50%',background:'#fff',transition:'left 0.2s'}}/>
                </div>
                <span style={{fontSize:12,color:C.t2}}>Published</span>
              </div>
              <div style={{flex:1}}/>
              <button onClick={cancel}
                style={{padding:'5px 14px',border:`1px solid ${C.border}`,borderRadius:6,fontSize:12,color:C.t2,background:'#fff',cursor:'pointer'}}>
                Cancel
              </button>
              <button onClick={save} disabled={!canSave}
                style={{padding:'5px 14px',background:canSave?C.primary:'#c4c8f0',color:'#fff',border:'none',borderRadius:6,fontSize:12,fontWeight:500,cursor:canSave?'pointer':'default'}}>

      {/* List */}
      <div style={{flex:1,overflowY:'auto',padding:'16px 24px'}}>

          <div style={{textAlign:'center',padding:'60px 0'}}>
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"
              style={{color:'#d1d5db',margin:'0 auto 12px',display:'block'}}>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01M22 12A10 10 0 1 1 2 12a10 10 0 0 1 20 0z"/>
            </svg>
            <p style={{fontSize:13,color:C.t3,margin:0}}>{isAdmin?'No FAQs yet. Click "Add FAQ" to get started.':'No FAQs have been published yet.'}</p>
          </div>
        ) : (
          <div style={{display:'flex',flexDirection:'column',gap:8,maxWidth:820}}>
            {visible.map((faq,i)=>(
              <FaqCard key={faq.id} faq={faq} index={i+1} isAdmin={isAdmin}
                onEdit={()=>openEdit(faq)} onDelete={()=>remove(faq.id)} onToggle={()=>toggle(faq.id)}/>

        )}
      </div>
    </div>
  );
};
